<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" role="img" aria-label="Bole Friday — Portharcourt Bole in Abuja">
  <!-- Vector redraw of the Bole Friday badge. Drop the original file in as assets/logo.png to use it instead. -->
  <defs>
    <linearGradient id="red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0452b"/><stop offset="1" stop-color="#c8231a"/>
    </linearGradient>
  </defs>
  <!-- badge -->
  <path d="M18 62 Q18 46 34 46 L78 46 Q120 2 162 46 L206 46 Q222 46 222 62 L214 150 Q212 166 196 166 L44 166 Q28 166 26 150 Z"
        fill="#fff" stroke="url(#red)" stroke-width="6" stroke-linejoin="round"/>
  <path d="M30 64 Q30 56 38 56 L82 56 Q120 18 158 56 L202 56 Q210 56 210 64 L203 146 Q202 156 192 156 L48 156 Q38 156 37 146 Z"
        fill="none" stroke="#f2a33a" stroke-width="1.6"/>
  <!-- swirls -->
  <path d="M40 82 q14 -10 30 -2 q-10 -2 -14 6 q-4 8 -16 -4z" fill="#f2a33a"/>
  <path d="M200 82 q-14 -10 -30 -2 q10 -2 14 6 q4 8 16 -4z" fill="#f2a33a"/>
  <!-- grill legs -->
  <path d="M106 88 l-8 18 M134 88 l8 18 M120 90 v16" stroke="#c8231a" stroke-width="4" stroke-linecap="round"/>
  <!-- grill bowl -->
  <path d="M90 70 h60 a30 22 0 0 1 -60 0z" fill="url(#red)"/>
  <!-- food on grill -->
  <ellipse cx="111" cy="68" rx="10" ry="5" fill="#f2a33a"/>
  <ellipse cx="128" cy="67" rx="9" ry="5" fill="#e07a1f"/>
  <path d="M107 66l3 5M114 65l3 5M125 64l3 5" stroke="#7a2e2e" stroke-width="1.6" stroke-linecap="round"/>
  <!-- flames -->
  <path d="M100 66 q-2 -10 4 -14 q-1 6 4 8 q-2 4 -8 6z" fill="#f2a33a"/>
  <path d="M140 66 q2 -10 -4 -14 q1 6 -4 8 q2 4 8 6z" fill="#f2a33a"/>
  <!-- open lid -->
  <g transform="rotate(-28 92 60)">
    <path d="M92 60 a26 20 0 0 1 52 0z" fill="url(#red)"/>
    <rect x="114" y="34" width="8" height="5" rx="2" fill="#7a2e2e"/>
  </g>
  <!-- wordmark -->
  <text x="120" y="133" text-anchor="middle" font-family="Anton, Impact, 'Arial Narrow', sans-serif" font-size="34" font-weight="900" fill="url(#red)" textLength="164" lengthAdjust="spacingAndGlyphs">BOLE FRIDAY</text>
  <!-- ribbon -->
  <path d="M46 140 h148 l-6 7 6 7 h-148 l6 -7z" fill="url(#red)"/>
  <text x="120" y="150.5" text-anchor="middle" font-family="Comfortaa, 'Trebuchet MS', sans-serif" font-weight="700" font-size="8.5" fill="#fff" textLength="130" lengthAdjust="spacingAndGlyphs">Portharcourt Bole In Abuja</text>
</svg>
