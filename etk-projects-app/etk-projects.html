<title>Projects Hub</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: an app shell. Red brand bar, a left menu for the signed-in role (bottom row on phones), one screen at a time.
   Light only, white background, at the owner's request (same as the dashboard). */
:root{
  color-scheme:light;
  --brand:#C82227; --brand-dark:#9E1A1E; --brown:#392412; --brand-soft:#FBE9E8;
  --bg:#FFFFFF; --panel:#FFFFFF; --soft:#F5F3F1; --soft-2:#ECE8E4; --ink:#1B1F24; --ink-2:#4F5761; --muted:#737B85; --line:#E3DFDB;
  --good:#1B7F4C; --good-soft:#E3F2EA; --warn:#9A6400; --warn-soft:#FBF0D9; --crit:#B4302A; --crit-soft:#FAE4E2; --none:#737B85; --none-soft:#F0EEEC;
  --font:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:14.5px/1.5 var(--font)}
h1,h2,h3,h4{margin:0;letter-spacing:-.015em;text-wrap:balance}
h1{font-size:23px;font-weight:800}
h2{font-size:17px;font-weight:700}
h3{font-size:15px;font-weight:700}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.small{font-size:13px;color:var(--ink-2)}
.note{font-size:12.5px;color:var(--muted)}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.between{justify-content:space-between}
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.two{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.wide{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
@media (max-width:980px){.two,.wide{grid-template-columns:minmax(0,1fr)}}

/* shell */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--brand)}
.bar{background:var(--brand);color:#fff;position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.bar .in{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px;letter-spacing:-.01em}
.brand i{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:7px;background:#fff;color:var(--brand);font-style:normal;font-weight:800;font-size:12px}
.who{display:flex;align-items:center;gap:10px;font-size:13px}
.who .av{background:#fff;color:var(--brand)}
.who button{border:1px solid rgba(255,255,255,.55);background:transparent;color:#fff;border-radius:7px;padding:4px 10px;cursor:pointer;font-size:12.5px;font-weight:600}
.mode{font-size:12.5px;padding-block:7px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--soft);border-bottom:1px solid var(--line);color:var(--ink-2)}
.mode b{color:var(--ink)}
.shell{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:calc(100vh - 54px)}
.menu{border-right:1px solid var(--line);padding:16px 10px;display:flex;flex-direction:column;gap:3px;background:var(--panel)}
.menu .role{padding:6px 10px 12px;border-bottom:1px solid var(--line);margin-bottom:8px}
.menu button{display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left;border:0;background:none;padding:9px 10px;border-radius:8px;cursor:pointer;font-weight:600;color:var(--ink-2);font-size:14px}
.menu button:hover{background:var(--soft)}
.menu button[aria-current="page"]{background:var(--brand-soft);color:var(--brand-dark)}
.count{min-width:20px;padding:0 6px;border-radius:10px;background:var(--brand);color:#fff;font-size:11px;line-height:20px;text-align:center}
.content{padding-block:22px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0}
.content>.stack{max-width:1180px;margin:0 auto}
@media (max-width:820px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .menu{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:8px max(16px,env(safe-area-inset-left,0px));position:sticky;top:calc(env(safe-area-inset-top,0px) + 52px);z-index:15}
  .menu .role{display:none}
  .menu button{flex:none;white-space:nowrap;padding:7px 10px;font-size:13px}
  .who .name{display:none}
}

/* parts */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;min-width:0}
.panel-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:12px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px 15px}
.kpi .v{font-size:25px;font-weight:800;line-height:1.15;margin-top:3px;letter-spacing:-.02em}
.kpi .n{font-size:12px;color:var(--ink-2);margin-top:2px}
.kpi.alert{border-color:var(--brand);background:var(--brand-soft)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--brand);background:var(--brand);color:#fff;border-radius:8px;padding:8px 14px;font-weight:700;cursor:pointer;font-size:13.5px;white-space:nowrap}
.btn:hover{background:var(--brand-dark)}
.btn.ghost{background:var(--panel);color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{background:var(--soft)}
.btn.small{padding:4px 10px;font-size:12.5px}
.btn.big{padding:12px 18px;font-size:15px;width:100%}
.btn:disabled{opacity:.5;cursor:default}
.link{border:0;background:none;padding:0;color:var(--brand-dark);font-weight:700;cursor:pointer;font-size:13px;text-align:left}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:999px;white-space:nowrap}
.pill i{font-style:normal;font-size:10.5px}
.s-good{background:var(--good-soft);color:var(--good)}.s-warn{background:var(--warn-soft);color:var(--warn)}.s-crit{background:var(--crit-soft);color:var(--crit)}.s-none{background:var(--none-soft);color:var(--none)}
.chip{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:5px;border:1px solid var(--line);color:var(--ink-2);white-space:nowrap}
.chip.red{border-color:var(--brand);color:var(--brand-dark)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:3px}
.d-good{background:var(--good)}.d-warn{background:var(--warn)}.d-crit{background:var(--crit)}.d-none{background:var(--none)}
.av{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--brown);color:#fff;font-weight:800;font-size:11.5px;flex:none}
.tscroll{overflow-x:auto;margin-inline:-4px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:8px 9px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 9px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--soft)}
.strong{font-weight:700}
.bar2{position:relative;height:10px;border-radius:5px;background:var(--soft-2);min-width:110px}
.bar2 .f{position:absolute;inset:0 auto 0 0;border-radius:5px;background:var(--brown)}
.bar2 .t{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--brand)}
.bl{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--ink-2);margin-top:3px}
.empty{border:1.5px dashed var(--line);border-radius:12px;padding:24px;text-align:center;color:var(--ink-2)}
.callout{border-left:3px solid var(--brand);background:var(--brand-soft);padding:10px 14px;border-radius:0 8px 8px 0;font-size:13.5px}
.okmsg{color:var(--good);font-weight:600;font-size:13px}
.errmsg{color:var(--crit);font-weight:600;font-size:13px}

/* forms */
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.form .full{grid-column:1/-1}
label{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600}
label .hint{font-weight:400;color:var(--muted);font-size:12.5px}
input,select,textarea{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 10px;font-size:14.5px;font-weight:400;min-width:0;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--brand)}
textarea{resize:vertical;line-height:1.45;min-height:70px}
.check{flex-direction:row;align-items:flex-start;gap:8px;font-weight:500}
.check input{width:auto;margin-top:3px}
.rows{display:flex;flex-direction:column;gap:8px}
.r{display:grid;gap:8px;align-items:end;padding:10px;border:1px solid var(--line);border-radius:9px;background:var(--soft)}
.x{border:0;background:none;color:var(--muted);cursor:pointer;font-size:18px;height:38px;border-radius:6px}
.x:hover{color:var(--crit);background:var(--crit-soft)}
.steps{display:flex;gap:6px;margin-bottom:6px}
.steps div{flex:1;border-top:4px solid var(--soft-2);padding-top:6px;font-size:12.5px;color:var(--muted);font-weight:600}
.steps div.on{border-color:var(--brand);color:var(--ink)}
.steps div.done{border-color:var(--brown);color:var(--ink-2)}
@media (max-width:640px){.steps div span{display:none}}

/* sign in */
.signin{min-height:100vh;display:grid;place-items:center;padding-block:40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:linear-gradient(180deg,var(--brand) 0 210px,var(--bg) 210px)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:0 12px 40px rgba(57,36,18,.12);padding:28px;width:100%;max-width:440px;display:flex;flex-direction:column;gap:16px}
.card.wide{max-width:760px}
.ms{display:inline-grid;grid-template-columns:repeat(2,9px);gap:2px}
.ms i{width:9px;height:9px}
.acct{display:flex;align-items:center;gap:12px;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:10px 12px;cursor:pointer;width:100%}
.acct:hover{border-color:var(--brand);background:var(--brand-soft)}
.acct b{display:block;font-size:14px}
.acct span{font-size:12.5px;color:var(--ink-2)}
.code{font-size:26px;letter-spacing:.4em;text-align:center;font-weight:700}

/* map */
.map{width:100%;height:auto;max-height:430px;display:block}
.map path{fill:var(--soft-2);stroke:#fff;stroke-width:.4}
.map path.on{fill:#E7B9B6}
.map circle{cursor:pointer}
#tip{position:fixed;pointer-events:none;background:var(--ink);color:#fff;font-size:12.5px;padding:7px 10px;border-radius:7px;z-index:60;max-width:270px;line-height:1.4}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:#fff;padding:10px 16px;border-radius:9px;font-size:13.5px;z-index:70;max-width:min(560px,calc(100vw - 32px));box-shadow:0 8px 24px rgba(0,0,0,.2)}
.heat{display:grid;grid-template-columns:22px repeat(5,minmax(0,1fr));gap:3px;max-width:340px;font-size:11.5px}
.heat span{display:grid;place-items:center;color:var(--muted)}
.heat b{aspect-ratio:1.5;border-radius:4px;display:grid;place-items:center;font-size:12px}
.hl{background:var(--good-soft)}.hm{background:var(--warn-soft)}.hh{background:var(--crit-soft)}
.timeline{display:flex;flex-direction:column;gap:10px;border-left:2px solid var(--line);padding-left:14px;margin-left:5px}
.timeline div{position:relative;font-size:13.5px}
.timeline div::before{content:"";position:absolute;left:-20px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--soft-2)}
.timeline div.done::before{background:var(--good)}
.timeline div.now::before{background:var(--brand)}
.diff td.old{color:var(--muted)}
.mark{background:var(--warn-soft);color:var(--warn);font-weight:700;border-radius:4px;padding:1px 6px;font-size:12px;white-space:nowrap}
.mark.ok{background:var(--good-soft);color:var(--good)}
.ai-out{white-space:pre-wrap;font-size:14px;line-height:1.6}
</style>

<div id="app"></div>
<div id="tip" hidden></div>
<div id="toast" hidden role="status" aria-live="polite"></div>

const worst = xs => xs.reduce((a, b) => rank[b] > rank[a] ? b : a, "none");
const elapsed = p => Math.min(1, Math.max(0, (TODAY - parse(p.start)) / Math.max(DAY, parse(p.end) - parse(p.start))));
const latest = m => m.history?.length ? m.history[m.history.length - 1] : null;
function mStatus(p, m) { const l = latest(m); if (!l) return "none"; const span = m.target - m.baseline; const pr = span ? (l.value - m.baseline) / span : 1; const r = m.mode === "count" ? pr / Math.max(.02, elapsed(p)) : pr; return r >= .9 ? "good" : r >= .7 ? "warn" : "crit"; }
const pStatus = p => worst((p.metrics || []).map(m => mStatus(p, m)));
const budget = p => (p.budgetLines || []).reduce((n, l) => n + (+l.amount || 0), 0);
const spent = p => (p.budgetLines || []).reduce((n, l) => n + (+l.spent || 0), 0);
const FREQ = { Weekly:7, Monthly:30, Quarterly:91 };
function flags(p) {
  const out = [];
  for (const m of p.metrics || []) { const s = mStatus(p, m); if (s === "warn" || s === "crit") out.push({ s, kind:"Result", text:`${m.name} is ${STATUS[s].label.toLowerCase()}: ${fmt(latest(m).value, m.unit)} against ${fmt(m.target, m.unit)}.` }); }
  const b = budget(p), sp = spent(p);
  if (b) { if (sp > b) out.push({ s:"crit", kind:"Budget", text:`Overspent: ${money(sp)} of ${money(b)}.` }); else if (sp / b - elapsed(p) > .1) out.push({ s:"warn", kind:"Budget", text:`Spending ahead of time: ${pct(sp / b)} used, ${pct(elapsed(p))} of time gone.` }); }
  for (const l of p.budgetLines || []) if (l.amount && l.spent > l.amount) out.push({ s:"crit", kind:"Budget", text:`${l.name} line is over budget.` });
  for (const m of p.milestones || []) if (!m.done && m.due < todayIso) { const d = daysBetween(m.due, todayIso); out.push({ s:d > 14 ? "crit" : "warn", kind:"Milestone", text:`“${m.name}” is ${d} days overdue.` }); }
  const q = p.lastUpdate ? daysBetween(p.lastUpdate, todayIso) : 0;
  if (q > 30) out.push({ s:"warn", kind:"Gone quiet", text:`No update for ${q} days.` });
  return out;
}
function updateDue(p) { const f = Math.min(...(p.metrics || []).map(m => FREQ[m.frequency] || 30), 30); return p.lastUpdate ? daysBetween(p.lastUpdate, todayIso) >= f - 3 : true; }
const riskScore = r => r.l * r.i;
const riskRating = r => riskScore(r) >= 15 ? "High" : riskScore(r) >= 8 ? "Medium" : "Low";

// ---------- Store: shared database, or practice mode in this browser ----------
const COLS = ["projects", "updates", "risks", "snapshots", "access", "questions", "audit", "messages", "settings"];
const LOCAL_KEY = "projects-hub-practice-v1";
const S = { mode:"connecting", readOnly:false, data:Object.fromEntries(COLS.map(c => [c, {}])), loaded:false, db:null, pendingRefresh:false };
const all = c => Object.values(S.data[c]);
function saveLocal() { try { localStorage.setItem(LOCAL_KEY, JSON.stringify(S.data)); } catch {} }
async function put(col, doc) {
  S.data[col][doc.id] = doc;
  if (S.mode === "local") { saveLocal(); return true; }
  if (S.readOnly) { toast("You can view the shared data but not change it. Ask the owner to make you a Contributor."); return false; }
  try { await S.db.collection(col).doc(doc.id).set(JSON.parse(JSON.stringify(doc))); return true; }
  catch (e) {
    if (e?.code === "invalid_argument") { S.readOnly = true; toast("You can view the shared data but not change it. Ask the owner to make you a Contributor."); }
    else if (e?.code === "quota_exceeded") toast("The shared database is full. Ask the owner to archive old records.");
    else toast("Couldn't save just now. Check your connection and try again.");
    return false;
  }
}
async function log(action, target) { await put("audit", { id:uid("e"), at:new Date().toISOString(), who:me().id, action, target:target || "" }); }
function loadPractice(fromFile) {
  S.mode = "local";
  try { const saved = JSON.parse(localStorage.getItem(LOCAL_KEY)); if (saved && saved.projects && !fromFile) { S.data = { ...S.data, ...saved }; S.loaded = true; return render(); } } catch {}
  fetch("sample-data.json").then(r => r.json()).then(d => {
    d = shiftDates(d, d.base ? daysBetween(d.base, todayIso) : 0); // practice copy always looks current
    for (const c of COLS) S.data[c] = Object.fromEntries((d[c] || []).map(x => [x.id, x]));
    S.loaded = true; saveLocal(); render();
  }).catch(() => { S.loaded = true; render(); });
}
/** Moves every date in the example data by the same number of days, so it reads as "now". */
function shiftDates(v, days) {
  if (!days) return v;
  if (typeof v === "string" && /^\d{4}-\d{2}-\d{2}/.test(v)) { const t = new Date(Date.parse(v.length === 10 ? v + "T00:00:00Z" : v) + days * DAY).toISOString(); return v.length === 10 ? t.slice(0, 10) : t; }
  if (Array.isArray(v)) return v.map(x => shiftDates(x, days));
  if (v && typeof v === "object") return Object.fromEntries(Object.entries(v).map(([k, x]) => [k, k === "base" ? x : shiftDates(x, days)]));
  return v;
}
async function connect() {
  let db = null;
  try { db = window.claude?.use ? await window.claude.use("db") : null; } catch { db = null; }
  if (!db) return loadPractice();
  S.db = db; S.mode = "shared";
  let first = new Set(), timer = setTimeout(() => { if (!S.loaded) { S.loaded = true; S.slow = true; render(); } }, 10000);
  for (const c of COLS) {
    db.collection(c).onSnapshot(snap => {
      S.data[c] = Object.fromEntries(snap.docs.map(d => [d.id, d.data()]));
      if (!snap.metadata.fromCache) first.add(c);
      if (first.size === COLS.length && !S.loaded) { S.loaded = true; clearTimeout(timer); }
      remoteChanged();
    }, err => { if (err.code === "revoked" || err.code === "not_granted") { toast("Shared data is no longer available. Switched to practice mode."); loadPractice(); } });
  }
}
let rt = null;
function remoteChanged() {
  clearTimeout(rt);
  rt = setTimeout(() => { if ((FORM_VIEWS.includes(V.view) && V.formTouched || V.cmp) && S.loaded) { S.pendingRefresh = true; renderBanner(); } else render(); }, 120);
}

function teamIds(u = me()) { return PEOPLE.filter(p => p.manager === u.id).map(p => p.id); }
function visibleProjects(u = me()) {
  const ps = all("projects");
  if (u.role === "lead" || u.role === "finance") return ps;
  if (u.role === "manager") { const t = teamIds(u); return ps.filter(p => p.approverId === u.id || p.ownerId === u.id || t.includes(p.ownerId) || (p.members || []).includes(u.id)); }

}
// Project dashboard access: everyone inside the organisation by default; the Global lead can limit it to chosen people.
const dashSettings = () => ({ id:"dashboard", mode:"everyone", allowed:[], requests:[], ...(S.data.settings?.dashboard || {}) });
function hasDashboard(u = me()) { if (!INTERNAL.includes(u.role)) return false; if (u.role === "lead") return true; const d = dashSettings(); return d.mode === "everyone" || d.allowed.includes(u.id); }

const activeProjects = () => all("projects").filter(p => p.status === "active");

function canSeeProjectDetail(p, u = me()) { return u.role === "lead" || u.role === "finance" || visibleProjects(u).some(x => x.id === p.id); }
function pendingApprovals(u = me()) {
  const ps = all("projects"), byId = Object.fromEntries(ps.map(p => [p.id, p]));
  const items = [];
  for (const p of ps) if (p.status === "pending" && p.approverId === u.id) items.push({ kind:"project", id:p.id, at:p.createdAt });
  for (const up of all("updates")) if (up.status === "pending" && byId[up.projectId]?.approverId === u.id) items.push({ kind:"update", id:up.id, at:up.submittedAt });
  if (u.role === "lead") {
    for (const r of all("risks")) if (r.status === "Escalated") items.push({ kind:"risk", id:r.id, at:r.escalatedAt });
    for (const a of all("access")) if (a.status === "pending") items.push({ kind:"access", id:a.id, at:a.invitedAt });
  }
  return items.sort((a, b) => (a.at || "") < (b.at || "") ? -1 : 1);
}

// BEHIND-SCHEDULE EMAILS: automatic alerts and "Email the team"
// Messages appear in each person's Messages inbox straight away, and are
// queued for email. Real email goes out once an email account is connected.

const ALERT_DEFAULT = { on:true, behind:true, milestone:true, update:true, budget:true, toOwner:true, toTeam:true, ccManager:true, frequency:"Weekly" };
const alertSettings = p => ({ ...ALERT_DEFAULT, ...(p.alerts || {}) });
function alertReasons(p, a = alertSettings(p)) {
  if (p.status !== "active") return [];
  const out = [];
  for (const f of flags(p)) {
    if (f.kind === "Result" && a.behind) out.push(f.text);
    if (f.kind === "Milestone" && a.milestone) out.push(f.text);
    if (f.kind === "Budget" && a.budget) out.push(f.text);
    if (f.kind === "Gone quiet" && a.update) out.push(f.text);
  }
  const waiting = all("updates").some(x => x.projectId === p.id && x.status === "pending");
  if (a.update && updateDue(p) && !waiting && !out.some(t => t.startsWith("No update"))) out.push(`The ${periodLabel(period())} update is due.`);
  return out;
}
function recipients(p, a = alertSettings(p)) {
  const to = new Set(), cc = new Set();
  if (a.toOwner) to.add(p.ownerId);
  if (a.toTeam) (p.members || []).filter(id => INTERNAL.includes(person(id).role)).forEach(id => to.add(id));
  if (a.ccManager && p.approverId) cc.add(p.approverId);
  to.forEach(id => cc.delete(id));
  return { to:[...to], cc:[...cc] };
}
const weekKey = () => { const d = new Date(TODAY); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return iso(d); };
function draftEmail(p, reasons, from) {
  const r = recipients(p), names = r.to.map(id => person(id).name.split(" ")[0]);
  const due = iso(new Date(+TODAY + 5 * DAY)), needsUpdate = reasons.some(t => /update is due|No update/.test(t));
  return { subject:`${p.name} is falling behind: action needed by ${shortDate(due)}`,
    body:`Hi ${names.length ? names.join(" and ") : "team"},\n\n${p.name} is falling behind schedule:\n${reasons.map(t => "• " + t).join("\n")}\n\nPlease ${needsUpdate ? "send your monthly update" : "update the plan and the figures"} by ${fmtDate(due)}. If something is blocking you, reply and we'll agree a recovery plan together.\n\nYou can see the details in Projects Hub, under ${p.name}.\n\n${from ? person(from).name + "\n" + person(from).title : "Projects Hub (automatic alert)"}` };
}
async function sendMessage(p, { to, cc, subject, body, kind, reasons, id }) {
  const u = me();
  const m = { id:id || uid("msg"), kind, projectId:p.id, from:kind === "auto" ? "system" : u.id, onBehalfOf:kind === "auto" ? p.approverId : u.id, to, cc, subject, body, reasons:reasons || [], createdAt:new Date().toISOString(), readBy:[],
    email:{ status:"waiting", to:to.map(x => person(x).email), cc:cc.map(x => person(x).email), sentAt:null } };
  if (!(await put("messages", m))) return null;
  await log(kind === "auto" ? `Automatic behind-schedule alert sent to the team` : `Emailed the team: ${subject}`, p.id);
  return m;
}
/** Runs when someone opens the app: for each project they own or manage, sends one alert per week (or day) while it's behind. */
async function runAutoAlerts() {
  const u = me();
  if (!["staff", "manager", "lead"].includes(u.role) || S.readOnly) return;
  const mine = all("projects").filter(p => p.status === "active" && (p.ownerId === u.id || p.approverId === u.id || u.role === "lead"));
  let n = 0;
  for (const p of mine) {
    const a = alertSettings(p); if (!a.on) continue;
    const reasons = alertReasons(p, a); if (!reasons.length) continue;
    const id = `auto-${p.id}-${a.frequency === "Daily" ? todayIso : weekKey()}`;
    if (S.data.messages[id]) continue;
    const r = recipients(p, a); if (!r.to.length) continue;
    const d = draftEmail(p, reasons, null);
    if (await sendMessage(p, { ...r, ...d, kind:"auto", reasons, id })) n++;
    if (S.readOnly) return;
  }
  if (n) { toast(`${n} automatic behind-schedule alert${n > 1 ? "s" : ""} sent to project teams.`); render(); }
}

function vTeam(u) {
  const ids = [u.id, ...teamIds(u)], ps = visibleProjects(u).filter(p => p.status === "active" || ids.includes(p.ownerId));
  const act = ps.filter(p => p.status === "active");

function checksFor(up, p) {
  const out = [];
  for (const m of up.metrics || []) {
    const def = p.metrics.find(x => x.id === m.metricId), last = latest(def || {})?.value;
    if (!def) continue;
    const value = m.value ?? (last ?? 0) + (m.add || 0);
    if (def.mode === "count" && last != null && value < last) out.push(`${def.name} goes down (${fmt(last, def.unit)} → ${fmt(value, def.unit)}). Running totals shouldn't fall.`);
    if (last && value > last * 2 && value - last > 10) out.push(`${def.name} more than doubled. Check the evidence.`);
  }
  for (const s of up.spend || []) { const l = p.budgetLines.find(x => x.id === s.lineId); if (!l) continue; const after = l.spent + s.amount; if (after > l.amount) out.push(`${l.name} goes over its budget line (${money(after)} of ${money(l.amount)}).`); else if (after / l.amount > .8) out.push(`${l.name} will be ${pct(after / l.amount)} used.`); }
  if ((up.spend || []).length && !(up.evidence?.files || []).length) out.push("Spend reported with no receipt attached.");
  if (up.evidence?.personalData && !up.evidence?.consent) out.push("Files with personal data but no consent recorded.");
  return out;
}

async function approve(kind, id) {

  const up = JSON.parse(JSON.stringify(S.data.updates[id])), p = JSON.parse(JSON.stringify(S.data.projects[up.projectId]));
  for (const m of up.metrics || []) { const d = p.metrics.find(x => x.id === m.metricId); if (!d) continue; const v = m.value ?? (latest(d)?.value ?? 0) + (m.add || 0); d.history = d.history || []; const last = d.history[d.history.length - 1]; if (last && last.date === todayIso) { last.value = v; last.by = up.by; } else d.history.push({ date:todayIso, value:v, by:up.by }); }

}

    <div class="panel stack"><div class="form">
      <label for="rt-n">${esc(m ? m.name : "People reached")} this month<span class="hint">A count. No names needed.</span><input id="rt-n" type="number" min="0" placeholder="e.g. 186"></label>
      <label for="rt-s">Sessions delivered<input id="rt-s" type="number" min="0" placeholder="e.g. 12"></label>
      <label class="full" for="rt-note">Anything the project team should know?<textarea id="rt-note" rows="2"></textarea></label>
      <label class="full" for="rt-file">Attendance list<span class="hint">Optional. Only if your agreement asks for it.</span><input id="rt-file" type="file"></label>
      <label class="check full"><input type="checkbox" id="rt-consent"> Everyone on the attendance list agreed to share their details with us</label></div>
      <div class="row between"><span class="errmsg" id="rtErr" role="alert"></span><button class="btn" data-act="partner-send" data-id="${pid}">Send to the project team</button></div></div>
    <div class="panel"><h2 style="margin-bottom:8px">Your returns</h2>${mine.map(x => `<div class="row between" style="padding:7px 0;border-top:1px solid var(--line)"><span class="small">${periodLabel(x.period)} · +${x.metrics?.[0]?.add ?? 0} ${esc(m?.name.toLowerCase() || "")} ${x.comment ? `· Project team: “${esc(x.comment)}”` : ""}</span><span class="pill ${x.status === "approved" ? "s-good" : x.status === "returned" ? "s-warn" : "s-none"}">${x.status === "approved" ? "Accepted" : x.status === "returned" ? "Returned" : "With the project team"}</span></div>`).join("") || `<p class="small">None yet.</p>`}</div>`;
}

// ======================================================================
// EVENTS
// ======================================================================
const app = document.getElementById("app");
app.addEventListener("click", async e => {
  const t = e.target, n = t.closest("[data-nav]");
  if (n) { if (n.dataset.nav === "new") V.wiz = null; return go(n.dataset.nav); }
  const a = t.closest("[data-act]"); if (!a) return;
  const act = a.dataset.act, id = a.dataset.id;
  // sign in
  if (act === "si-ms") { V.signin = "pick"; return render(); }
  if (act === "si-ext") { V.signin = "pick-ext"; return render(); }
  if (act === "si-back") { V.signin = V.signin === "verify" ? (INTERNAL.includes(person(V.pick).role) ? "pick" : "pick-ext") : "start"; return render(); }
  if (act === "si-pick") { V.pick = id; V.signin = "verify"; return render(); }
  if (act === "si-verify") { if (!/^\d{6}$/.test(document.getElementById("code").value)) { toast("Enter the 6-digit code."); return; } V.meId = V.pick; try { localStorage.setItem("projects-hub-me", V.meId); } catch {} V.view = ""; V.params = {}; V.signin = "start"; render(); if (S.loaded) log(INTERNAL.includes(me().role) ? "Signed in" : "Signed in from outside the organisation"); return; }
  if (act === "signout") { V.meId = null; V.wiz = null; V.ci = null; V.cmp = null; V.dashManage = false; V.view = ""; try { localStorage.removeItem("projects-hub-me"); } catch {} V.signin = "pick"; return render(); }
  if (act === "reset") { if (a.dataset.armed) { try { localStorage.removeItem(LOCAL_KEY); } catch {} return loadPractice(true); } a.dataset.armed = "1"; a.textContent = "Click again to wipe your practice changes"; return; }
  if (act === "refresh") { S.pendingRefresh = false; return render(); }
  // navigation
  if (act === "open") return go("project", { id });
  if (act === "checkin") { V.ci = null; return go("checkin", { id }); }
  if (act === "edit-project") { V.wiz = newWiz(S.data.projects[id]); V.view = "new"; return render(); }
  // wizard
  const w = V.wiz;
  if (act === "w-next") { const err = wizValidate(w); if (err) { document.getElementById("wErr").textContent = err; return; } w.step++; return render(); }
  if (act === "w-back") { w.step--; return render(); }
  if (act === "w-cancel") { V.wiz = null; return go(me().role === "staff" ? "home" : "projects"); }
  if (act === "w-submit") return wizSubmit();
  if (act === "bl-add") { w.budgetLines.push({ id:"l" + (w.budgetLines.length + 1) + Date.now().toString(36).slice(-3), name:"", amount:"", spent:0, rule:"" }); return render(); }
  if (act === "bl-del") { w.budgetLines.splice(+a.dataset.k, 1); return render(); }
  if (act === "mt-add") { w.metrics.push({ id:"k" + Date.now().toString(36).slice(-4), name:"", mode:"count", unit:"", baseline:0, target:"", frequency:"Monthly", history:[] }); return render(); }
  if (act === "mt-del") { w.metrics.splice(+a.dataset.k, 1); return render(); }
  if (act === "ms-add") { w.milestones.push({ id:"m" + Date.now().toString(36).slice(-4), name:"", due:"", done:null, clientSignoff:null }); return render(); }
  if (act === "ms-del") { w.milestones.splice(+a.dataset.k, 1); return render(); }
  // check-in
  if (act === "ci-draft") { ciSaveDraft(); toast("Draft saved on this device."); return; }
  if (act === "ci-submit") return ciSubmit();
  if (act === "ci-ai") return ciFromEmail();
  // approvals
  if (act === "approve") return approve(a.dataset.kind, id);
  if (act === "return") return sendBack(a.dataset.kind, id);
  if (act === "risk-decide") { const d = document.getElementById("dec-" + id).value.trim(); if (!d) return toast("Write the decision first."); const r = { ...S.data.risks[id], status:"Monitoring", decision:d, decidedBy:me().id }; if (await put("risks", r)) { await log(`Decided on an escalated risk: ${r.title}`, r.projectId); toast("Decision recorded and shared with the risk owner."); render(); } return; }
  if (act === "access-ok" || act === "access-deny") { const x = { ...S.data.access[id], status:act === "access-ok" ? "active" : "revoked", approvedBy:me().id }; if (await put("access", x)) { await log(`${act === "access-ok" ? "Approved" : "Declined"} external access for ${person(x.org).name}`, x.projectIds.join(",")); render(); } return; }
  if (act === "escalate") { const r = { ...S.data.risks[id], status:"Escalated", escalatedBy:me().id, escalatedAt:new Date().toISOString() }; if (await put("risks", r)) { await log(`Escalated a risk to leadership: ${r.title}`, r.projectId); toast("Escalated. Leadership will see it in their approvals."); render(); } return; }
  if (act === "dash-manage") { V.dashManage = !V.dashManage; return render(); }
  if (act === "dash-request") { const d = dashSettings(); return saveDash({ requests:[...d.requests.filter(r => r.id !== me().id), { id:me().id, at:new Date().toISOString() }] }, "Asked for access to the project dashboard"); }
  if (act === "dash-allow") { const d = dashSettings(); toast(`${person(id).name} can now see the project dashboard.`); return saveDash({ allowed:[...new Set([...d.allowed, id])], requests:d.requests.filter(r => r.id !== id) }, `Gave ${person(id).name} access to the project dashboard`); }
  if (act === "dash-decline") { const d = dashSettings(); return saveDash({ requests:d.requests.filter(r => r.id !== id) }, `Declined ${person(id).name}'s dashboard request`); }
  if (act === "dash-link") { const url = location.href.split("#")[0] + "#dashboard"; navigator.clipboard.writeText(url).then(() => toast("Link copied. Anyone with access opens the dashboard straight away after signing in.")).catch(() => toast("Link: " + url)); return; }
  if (act === "email-team") { const p = S.data.projects[id], r = recipients(p), reasons = alertReasons(p); V.cmp = { pid:id, ...r, ...draftEmail(p, reasons.length ? reasons : ["Please check the plan and send your latest figures."], me().id), reasons }; if (V.view !== "project" || V.params.id !== id) go("project", { id }); else render(); return; }
  if (act === "cmp-cancel") { V.cmp = null; return render(); }
  if (act === "cmp-send") { const c = V.cmp, p = S.data.projects[id]; if (!c.to.length) return toast("Choose at least one person to send to."); if (!c.subject.trim() || !c.body.trim()) return toast("Add a subject and a message."); const m = await sendMessage(p, { to:c.to, cc:c.cc, subject:c.subject.trim(), body:c.body, kind:"manual", reasons:c.reasons }); if (m) { V.cmp = null; toast(`Sent to ${[...c.to, ...c.cc].map(x => person(x).name.split(" ")[0]).join(", ")}. It's in their Messages now.`); render(); } return; }
  if (act === "email-all-behind") { const ps = visibleProjects(me()).filter(p => alertReasons(p).length); if (!a.dataset.armed) { a.dataset.armed = "1"; a.textContent = `Click again to email ${ps.length} project teams`; return; } let n = 0; for (const p of ps) { const r = recipients(p), reasons = alertReasons(p); if (r.to.length && await sendMessage(p, { ...r, ...draftEmail(p, reasons, me().id), kind:"manual", reasons })) n++; } toast(`Emailed ${n} project team${n === 1 ? "" : "s"}.`); return render(); }
  if (act === "box") { V.params = { box:a.dataset.box }; return render(); }
  if (act === "msg-open") { V.params = { ...V.params, mid:id }; return render(); }
  if (act === "msg-copy") { const m = S.data.messages[id], txt = `To: ${(m.email?.to || []).join(", ")}${m.email?.cc?.length ? "\nCc: " + m.email.cc.join(", ") : ""}\nSubject: ${m.subject}\n\n${m.body}`; navigator.clipboard.writeText(txt).then(() => toast("Copied. Paste it into a new email.")).catch(() => { const r = document.createRange(); r.selectNodeContents(document.getElementById("msgBody")); getSelection().removeAllRanges(); getSelection().addRange(r); toast("Couldn't copy automatically. The message is selected: press Ctrl+C."); }); return; }
  if (act === "remind") { await log("Sent an update reminder", id); toast(`Reminder sent to ${person(S.data.projects[id].ownerId).name}.`); return; }
  if (act === "reassign") { const p = S.data.projects[id], opts = PEOPLE.filter(x => ["staff", "manager"].includes(x.role) && x.id !== p.ownerId); a.outerHTML = `<span class="row" style="flex-wrap:nowrap"><select id="ra-${id}" aria-label="New owner">${opts.map(o => `<option value="${o.id}">${esc(o.name)}</option>`).join("")}</select><button class="btn small" data-act="reassign-do" data-id="${id}">Move</button></span>`; return; }
  if (act === "reassign-do") { const to = document.getElementById("ra-" + id).value, p = { ...S.data.projects[id], ownerId:to }; if (await put("projects", p)) { await log(`Reassigned the project to ${person(to).name}`, id); toast(`${person(to).name} now owns ${p.name}. Their reminders start now.`); render(); } return; }
  if (act === "answer") { const v = document.getElementById("ans-" + id).value.trim(); if (!v) return; const q = { ...S.data.questions[id], answer:v, answeredBy:me().id }; if (await put("questions", q)) { await log("Answered a question from outside the organisation", q.projectId); render(); } return; }
  // reports and access
  if (act === "rp-sign") return signReport();
  if (act === "rp-ai") { const note = document.getElementById("rpNote"); note.textContent = "Writing…"; try { const txt = await ai(`Rewrite this project update for ${V.params.aud === "funder" ? "a funder" : V.params.aud === "client" ? "a client" : "the organisation's leadership"}. Plain British English, warm and direct, under 120 words. Keep every number exactly as given and add none.\n\n${document.getElementById("rp-text").value}`); V.params.text = txt.trim(); render(); } catch { note.textContent = "Couldn't rewrite it just now."; } return; }
  if (act === "invite") return invite();
  if (act === "revoke") { if (!a.dataset.armed) { a.dataset.armed = "1"; a.textContent = "Click again to revoke"; return; } const x = { ...S.data.access[id], status:"revoked" }; if (await put("access", x)) { await log(`Revoked external access for ${person(x.org).name}`, x.projectIds.join(",")); render(); } return; }
  if (act === "fin-confirm") { const p = { ...S.data.projects[id], financeConfirmed:period() }; if (await put("projects", p)) { await log(`Confirmed ${periodLabel(period())} spend matches the books`, id); render(); } return; }
  // portfolio filters
  if (act === "pf-team") { V.params = { ...V.params, team:a.dataset.team }; return render(); }
  if (act === "pf-country") { V.params = { ...V.params, country:a.dataset.country }; return render(); }
  if (act === "pf-clear") { V.params = {}; return render(); }
  // external
  if (act === "ask") { const v = document.getElementById("ask-" + id).value.trim(); if (!v) return; if (await put("questions", { id:uid("q"), projectId:id, fromId:me().id, text:v, at:new Date().toISOString(), answer:"", answeredBy:null })) { await log("Asked the project team a question", id); toast("Sent. The project team will answer here."); render(); } return; }
  if (act === "client-sign") { const p = JSON.parse(JSON.stringify(S.data.projects[id])), m = p.milestones.find(x => x.id === a.dataset.m); m.clientSignoff = "approved"; if (await put("projects", p)) { await log(`Client approved the deliverable: ${m.name}`, id); toast("Thank you. The project team can see your approval."); render(); } return; }
  if (act === "partner-send") {
    const nv = +document.getElementById("rt-n").value, file = document.getElementById("rt-file").files[0], consent = document.getElementById("rt-consent").checked, err = document.getElementById("rtErr");
    if (!(nv > 0)) { err.textContent = "Enter how many this month."; return; }
    if (file && !consent) { err.textContent = "Confirm consent for the attendance list, or remove it."; return; }
    const p = S.data.projects[id], m = p.metrics.find(x => x.mode === "count");
    const up = { id:uid("u"), projectId:id, period:period(), by:me().id, submittedAt:new Date().toISOString(), status:"pending", source:"Delivery partner return",
      metrics:m ? [{ metricId:m.id, value:null, add:nv }] : [], spend:[], milestonesDone:[], risk:null, note:[document.getElementById("rt-s").value ? `${document.getElementById("rt-s").value} sessions delivered.` : "", document.getElementById("rt-note").value.trim()].filter(Boolean).join(" "),
      evidence:{ files:file ? [file.name] : [], personalData:!!file, consent }, comment:"", decidedBy:null, decidedAt:null };
    if (await put("updates", up)) { await log("Sent a monthly return", id); toast("Sent to the project team. You'll see when it's accepted."); render(); }
  }
});
app.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.matches("tr[data-act='open']")) e.target.click(); });
app.addEventListener("input", e => {
  const t = e.target, w = V.wiz;
  if (t.dataset.w != null) { w[t.dataset.w] = t.value; V.formTouched = true; if (t.dataset.w === "name") { const h = document.querySelector("main h1"); if (h) h.textContent = t.value || "Untitled project"; } return; }
  if (t.dataset.bl != null) { w.budgetLines[+t.dataset.bl][t.dataset.k] = t.value; V.formTouched = true; return; }
  if (t.dataset.mt != null) { w.metrics[+t.dataset.mt][t.dataset.k] = t.value; V.formTouched = true; return; }
  if (t.dataset.ms != null) { w.milestones[+t.dataset.ms][t.dataset.k] = t.value; V.formTouched = true; return; }
  const c = V.ci;
  if (c && t.dataset.ciM) { c.metrics.find(x => x.metricId === t.dataset.ciM).value = t.value; V.formTouched = true; ciSaveDraft(); return; }
  if (c && t.dataset.ciS) { c.spend.find(x => x.lineId === t.dataset.ciS).amount = t.value; V.formTouched = true; ciSaveDraft(); return; }
  if (c && t.dataset.ci === "risk") { c.risk = { text:t.value }; V.formTouched = true; ciSaveDraft(); return; }
  if (c && t.dataset.ci === "note") { c.note = t.value; V.formTouched = true; ciSaveDraft(); return; }
  if (t.dataset.rp === "text") { V.params.text = t.value; V.formTouched = true; return; }
  if (t.dataset.cmp && V.cmp) { V.cmp[t.dataset.cmp] = t.value; return; }
  if (t.dataset.pf === "q") { clearTimeout(t._d); t._d = setTimeout(() => { V.params = { ...V.params, q:t.value }; render(); }, 250); return; }
  if (t.closest("#main") && V.view === "access") V.formTouched = true;
});
app.addEventListener("change", async e => {
  const t = e.target, w = V.wiz, c = V.ci;
  if (t.dataset.w === "sector" && w) { if (!w.metrics.some(m => m.name.trim() && m.history?.length)) w.metrics = (TEMPLATES[t.value] || []).map(([n, mode, unit, b, tg], k) => ({ id:"k" + (k + 1), name:n, mode, unit, baseline:b, target:tg, frequency:"Monthly", history:[] })); return; }
  for (const key of ["to", "cc"]) if (t.dataset["cmp" + key[0].toUpperCase() + key[1]] && V.cmp) { const pid = t.dataset["cmp" + key[0].toUpperCase() + key[1]]; V.cmp[key] = t.checked ? [...new Set([...V.cmp[key], pid])] : V.cmp[key].filter(x => x !== pid); return render(); }
  if (t.dataset.dashMode) { const d = dashSettings(), mode = t.dataset.dashMode; return saveDash({ mode, allowed:mode === "chosen" && !d.allowed.length ? dashViewers().filter(x => x.role !== "lead").map(x => x.id) : d.allowed }, mode === "everyone" ? "Opened the project dashboard to everyone" : "Limited the project dashboard to chosen people"); }
  if (t.dataset.dashPerson) { const d = dashSettings(), id = t.dataset.dashPerson; return saveDash({ allowed:t.checked ? [...new Set([...d.allowed, id])] : d.allowed.filter(x => x !== id) }, `${t.checked ? "Gave" : "Removed"} ${person(id).name} ${t.checked ? "access to" : "from"} the project dashboard`); }
  if (t.dataset.alert) { const p = S.data.projects[t.dataset.id], k = t.dataset.alert, alerts = { ...alertSettings(p), [k]:k === "frequency" ? t.value : t.checked }; if (await put("projects", { ...p, alerts })) { await log(`Changed automatic alert settings (${k})`, p.id); render(); } return; }
  if (t.dataset.member && w) { w.members = t.checked ? [...w.members, t.dataset.member] : w.members.filter(x => x !== t.dataset.member); return; }
  if (c && t.dataset.ciMs) { c.milestonesDone = t.checked ? [...c.milestonesDone, t.dataset.ciMs] : c.milestonesDone.filter(x => x !== t.dataset.ciMs); ciSaveDraft(); return; }
  if (c && t.dataset.ciPd != null) { c.evidence.personalData = t.checked; if (!t.checked) c.evidence.consent = false; ciSaveDraft(); return render(); }
  if (c && t.dataset.ciConsent != null) { c.evidence.consent = t.checked; ciSaveDraft(); return; }
  if (c && t.id === "ci-files") { c.evidence.files = [...new Set([...c.evidence.files, ...[...t.files].map(f => f.name)])]; ciSaveDraft(); return render(); }
  if (t.dataset.risk) { const r = { ...S.data.risks[t.dataset.risk] }; r[t.dataset.k] = t.dataset.k === "status" ? t.value : +t.value; r.needsScoring = false; if (t.dataset.k === "status" && t.value === "Escalated") { r.escalatedBy = me().id; r.escalatedAt = new Date().toISOString(); } if (await put("risks", r)) { await log(`Updated a risk: ${r.title}`, r.projectId); render(); } return; }
  if (t.dataset.rp === "pid" || t.dataset.rp === "aud") { V.params = { ...V.params, [t.dataset.rp]:t.value, text:null }; if (t.dataset.rp === "pid") V.params.aud = "leadership"; return render(); }
  if (t.dataset.pf && t.dataset.pf !== "q") { V.params = { ...V.params, [t.dataset.pf]:t.value }; return render(); }
});

addEventListener("hashchange", () => { if (location.hash === "#dashboard" && V.meId && (NAV[me().role] || []).some(n => n[0] === "portfolio")) go("portfolio"); });
render();
connect();
</script>
