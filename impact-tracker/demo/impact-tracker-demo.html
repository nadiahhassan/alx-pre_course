<title>Impact Tracker Preview</title>
<style>
:root{

}

  --good:#0ca30c;--good-ink:#3cc23c;--warning:#fab219;--warning-ink:#fab219;--critical:#d03b3b;--critical-ink:#e66767;--band:rgba(255,255,255,.07);--shadow:0 12px 40px rgba(0,0,0,.6)}}
:root[data-theme="dark"]{color-scheme:dark;
  --page:#0d0d0d;--surface:#1a1a19;--surface-2:#262624;--ink:#fff;--ink-2:#c3c2b7;--muted:#9a988f;
  --line:#2c2c2a;--line-strong:#454541;--accent:#3987e5;--accent-ink:#86b6ef;--accent-soft:#184f95;
  --good:#0ca30c;--good-ink:#3cc23c;--warning:#fab219;--warning-ink:#fab219;--critical:#d03b3b;--critical-ink:#e66767;--band:rgba(255,255,255,.07);--shadow:0 12px 40px rgba(0,0,0,.6)}
*{box-sizing:border-box}
body{background:var(--page);color:var(--ink);font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tab-nums,.num{font-variant-numeric:tabular-nums}
.wrap{max-width:1240px;margin:0 auto;padding-inline:16px}
.preview-bar{background:var(--ink);color:var(--surface);font-size:13px}
.preview-bar .wrap{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;padding-block:8px}
.preview-bar button{background:transparent;border:1px solid color-mix(in srgb,var(--surface) 40%,transparent);color:var(--surface);border-radius:6px;padding:2px 10px;cursor:pointer}
header.app{background:var(--surface);border-bottom:1px solid var(--line)}
header.app .wrap{display:flex;flex-wrap:wrap;gap:8px 24px;align-items:center;padding-block:12px}
.brand{font-weight:650;letter-spacing:-.01em}
.nav{display:flex;gap:4px}
.nav a,.linkbtn{padding:4px 8px;border-radius:6px;color:var(--ink-2);text-decoration:none;cursor:pointer;background:none;border:0}
.nav a:hover,.linkbtn:hover{background:var(--surface-2);color:var(--ink)}
.nav a[aria-current="page"]{color:var(--ink);font-weight:550}
.who{margin-left:auto;color:var(--ink-2);font-size:13px}
main{padding-block:24px 64px}
h1{font-size:24px;letter-spacing:-.015em;margin:0;text-wrap:balance}
h2{font-size:18px;margin:0;letter-spacing:-.01em}
h3{font-size:15px;margin:0;font-weight:560}
p{margin:0}
.sub{color:var(--ink-2);font-size:13px}
.muted{color:var(--muted)}
.xs{font-size:12px}
.stack{display:flex;flex-direction:column;gap:24px}
.stack-sm{display:flex;flex-direction:column;gap:12px}
.row{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.between{justify-content:space-between}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px}
.pad{padding:16px}
.grid{display:grid;gap:16px}
.g3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr))}
.g3c{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.btn{display:inline-flex;align-items:center;gap:6px;border-radius:7px;padding:7px 12px;font-size:13px;font-weight:550;cursor:pointer;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-ink)}
.btn.small{padding:3px 8px;font-size:12px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;margin-block:16px 24px}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:8px 12px;margin-bottom:-1px;color:var(--ink-2);cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{border-color:var(--accent);color:var(--ink);font-weight:560}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line-strong);border-radius:8px;padding:2px;background:var(--surface)}
.seg button{border:0;background:none;padding:6px 12px;border-radius:6px;color:var(--ink-2);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.label{font-size:12px;color:var(--muted)}
.big{font-size:28px;font-weight:650;letter-spacing:-.02em;line-height:1.15}
.bigger{font-size:32px;font-weight:650;letter-spacing:-.02em;line-height:1.1}
.status{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:560;white-space:nowrap}
.status.lg{font-size:16px}
.status.green{color:var(--good-ink)}.status.amber{color:var(--warning-ink)}.status.red{color:var(--critical-ink)}.status.none{color:var(--muted)}
.conf{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:5px;padding:1px 6px;font-size:12px;color:var(--ink-2)}
.bars{display:inline-flex;align-items:flex-end;gap:1px}.bars i{display:block;width:2px;border-radius:1px;background:var(--line-strong)}.bars i.on{background:var(--ink-2)}
.chip{display:inline-block;border-radius:5px;padding:1px 6px;font-size:12px;background:var(--surface-2);color:var(--ink-2)}
.chip.ai{background:color-mix(in srgb,var(--accent-soft) 45%,transparent);color:var(--accent-ink);border:1px solid color-mix(in srgb,var(--accent) 40%,transparent);font-weight:560}
.chip.key{background:color-mix(in srgb,var(--accent-soft) 60%,transparent);color:var(--accent-ink)}
.progress{position:relative;height:8px;border-radius:99px;background:color-mix(in srgb,var(--accent-soft) 60%,transparent)}
.progress>b{display:block;height:8px;border-radius:99px;background:var(--accent)}
.progress>s{position:absolute;top:-4px;width:2px;height:16px;border-radius:2px;background:var(--ink)}
.track{height:6px;border-radius:99px;background:var(--surface-2)}.track>b{display:block;height:6px;border-radius:99px;background:var(--ink-2)}
.section-h{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:12px}
.alert{border:1px solid color-mix(in srgb,var(--warning) 60%,transparent);background:color-mix(in srgb,var(--warning) 12%,transparent);border-radius:10px;padding:14px 16px}
.risk{border:1px solid color-mix(in srgb,var(--warning) 50%,transparent);background:color-mix(in srgb,var(--warning) 10%,transparent);border-radius:7px;padding:6px 8px;font-size:12px}
.toc{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin-top:12px}
.toc li{list-style:none;background:var(--surface-2);border-radius:7px;padding:10px 12px;font-size:12px}
.toc ol{padding:0;margin:0}
.eyebrow{font-size:11px;font-weight:650;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th{font-weight:500;text-align:left;color:var(--muted);font-size:12px}
td,th{padding:8px 14px;vertical-align:top}
tbody tr+tr td,tbody tr+tr th{border-top:1px solid var(--line)}
thead tr{border-bottom:1px solid var(--line)}
.r{text-align:right}
.lvl-row td{background:var(--surface-2);padding:5px 14px}
svg.chart{display:block;width:100%;height:auto;overflow:visible}
svg.chart text{fill:var(--muted);font-size:11px}
.dot{cursor:pointer}
.tip{position:fixed;z-index:60;pointer-events:none;background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:6px 10px;font-size:12px;box-shadow:var(--shadow)}
.legend-n{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:3px;background:var(--band);font-size:10px;font-weight:650;color:var(--ink-2);box-shadow:inset 0 0 0 1px var(--line)}
.drawer{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.3);display:flex;justify-content:flex-end}

blockquote{margin:0;border-left:2px solid var(--line-strong);padding-left:12px;line-height:1.55}
.ev+.ev{border-top:1px solid var(--line);padding-top:20px;margin-top:20px}
.gridtbl{border-collapse:separate;border-spacing:0}
.gridtbl th,.gridtbl td{border-bottom:1px solid var(--line);padding:0}
.gridtbl thead th{padding:8px;text-align:right;position:sticky;top:0;background:var(--surface)}
.gridtbl thead th:first-child{text-align:left;left:0;z-index:2}
.gridtbl tbody th{position:sticky;left:0;background:var(--surface);z-index:1;border-right:1px solid var(--line);padding:6px 12px;min-width:230px;font-weight:400;color:var(--ink);font-size:14px}
.gridtbl input{width:100%;min-width:84px;height:36px;border:0;background:transparent;text-align:right;padding:0 8px}

.gridtbl input.est{font-style:italic}
.gridtbl input.bad{outline:2px solid var(--critical);outline-offset:-2px}
.gridtbl td.st{padding:0 12px;white-space:nowrap}
.gridtbl .lvl th{background:var(--surface-2);font-size:11px;font-weight:650;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);padding:4px 12px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:8px 14px;border-radius:8px;font-size:13px;z-index:70}
.gantt{position:relative;height:20px;border-radius:5px;background:var(--surface-2);flex:1}
.gantt b{position:absolute;top:0;height:20px;border-radius:5px;background:var(--accent)}

.snapbanner .tag{background:var(--ink);color:var(--surface);border-radius:5px;padding:1px 7px;font-size:12px;font-weight:560}
.masonry{columns:2 340px;column-gap:16px}.masonry>*{break-inside:avoid;margin-bottom:16px}

.field label{font-size:13px;font-weight:560}

.err{font-size:12px;color:var(--critical-ink)}
.input{width:100%;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);border-radius:7px;padding:8px 10px;font-size:14px}

.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.toc-row{display:grid;gap:8px;grid-template-columns:minmax(0,11rem) 1fr}

.who select{border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);border-radius:6px;padding:3px 6px;margin-left:6px}
code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;background:var(--surface-2);padding:1px 4px;border-radius:4px}

const nf = new Intl.NumberFormat("en-GB", { maximumFractionDigits: 2 });

  if (m) [y, mo, d] = [+m[1], +m[2], +m[3]];

    if (q) {
      if (c === '"' && text[i + 1] === '"') { cell += '"'; i++; }
      else if (c === '"') q = false;
      else cell += c;
    } else if (c === '"') q = true;
    else if (c === ",") { row.push(cell); cell = ""; }

// ---------- status logic (same rules as src/lib/status.ts) ----------
function series(p, asOf) {
  let run = p.baseline;
  return p.entries
    .filter((e) => ms(e.date) <= ms(asOf))
    .sort((a, b) => ms(a.date) - ms(b.date))

function progressOf(p, cur) {

  if (span === 0) return (p.direction === "decrease" ? cur <= p.target : cur >= p.target) ? 1 : 0;
  return (cur - p.baseline) / span;
}

function evaluate(proj, asOf) {

    return m;
  });
  const byId = Object.fromEntries(metrics.map((m) => [m.id, m]));
  metrics.forEach((m) => (m.riskFrom = []));
  metrics.forEach((m) => { if (m.lead && byId[m.lead] && (m.status === "amber" || m.status === "red")) byId[m.lead].riskFrom.push(m.name); });
  const counts = { green: 0, amber: 0, red: 0, "no-data": 0, "not-started": 0 };
  metrics.forEach((m) => counts[m.status]++);
  const pool = metrics.some((m) => m.isKey) ? metrics.filter((m) => m.isKey) : metrics;
  const st = pool.map((m) => m.status);
  const overall = st.includes("red") ? "red" : st.includes("amber") ? "amber" : st.includes("green") ? "green" : "no-data";
  const campaigns = [...proj.campaigns]
    .filter((c) => ms(c.start) <= ms(asOf))
    .sort((a, b) => ms(a.start) - ms(b.start))
    .map((c, i) => campaignSummary(c, asOf, i + 1));
  return { proj, asOf, metrics, counts, overall, campaigns, elapsed: expectedOf(proj.start, proj.end, asOf) };
}
function campaignSummary(c, asOf, n) {
  const totals = {};
  c.metrics.filter((m) => ms(m.date) <= ms(asOf)).forEach((m) => (totals[m.metric] = (totals[m.metric] || 0) + m.value));
  return { ...c, n, totals, ctr: totals.clicks && totals.impressions ? totals.clicks / totals.impressions : null, cps: c.spend && totals["sign-ups"] ? c.spend / totals["sign-ups"] : null };
}
const visible = (e, safe) => !safe || e.origin !== "ai" || e.approved;
/** Narrow an evaluation to one audience ("both" counts for each), recalculating counts. */
function filterE(E, audience) {
  if (audience === "all") return E;
  const metrics = E.metrics.filter((m) => matchesAudience(m.audience, audience));
  const counts = { green: 0, amber: 0, red: 0, "no-data": 0, "not-started": 0 };
  metrics.forEach((m) => counts[m.status]++);
  const pool = metrics.some((m) => m.isKey) ? metrics.filter((m) => m.isKey) : metrics;
  const st = pool.map((m) => m.status);
  const overall = st.includes("red") ? "red" : st.includes("amber") ? "amber" : st.includes("green") ? "green" : "no-data";
  return { ...E, metrics, counts, overall, campaigns: E.campaigns.filter((c) => matchesAudience(c.audience, audience)) };
}

// ---------- small components ----------
function status(s, lg) {
  const [label, cls, icon] = STATUS[s];
  return `<span class="status ${cls}${lg ? " lg" : ""}"><svg width="${lg ? 14 : 12}" height="${lg ? 14 : 12}" viewBox="0 0 12 12" aria-hidden="true">${icon}</svg>${label}</span>`;
}
function conf(c) {
  if (!c) return "";
  const n = { measured: 4, "self-reported": 3, estimated: 2, modelled: 2 }[c] || 1;
  return `<span class="conf" title="Latest value is ${c}"><span class="bars">${[1, 2, 3, 4].map((i) => `<i class="${i <= n ? "on" : ""}" style="height:${3 + i * 2}px"></i>`).join("")}</span>${cap(c)}</span>`;
}
const progress = (p, e) =>
  `<div class="progress"><b style="width:${Math.max(0, Math.min(1, p ?? 0)) * 100}%"></b>${e === null ? "" : `<s style="left:calc(${Math.min(1, e) * 100}% - 1px)" title="Expected at the latest update"></s>`}</div>`;
const expAt = (m) => (m.expected === null ? null : m.baseline + (m.target - m.baseline) * m.expected);
const empty = (title, body = "") => `<div class="card pad" style="text-align:center;padding-block:40px"><p style="font-weight:560">${title}</p>${body ? `<p class="sub" style="margin-top:6px">${body}</p>` : ""}</div>`;
const confirmBtn = (label, action, arg, cls = "btn small") => `<button type="button" class="${cls}" data-confirm="${action}" data-arg="${esc(arg)}" data-label="${esc(label)}">${label}</button>`;

function niceTicks(lo, hi, count = 4) {
  if (lo === hi) { const d = Math.abs(lo) || 1; lo -= d / 2; hi += d / 2; }
  const raw = (hi - lo) / count;
  const mag = 10 ** Math.floor(Math.log10(raw));
  const step = [1, 2, 2.5, 5, 10].map((x) => x * mag).find((s) => s >= raw) ?? 10 * mag;
  let start = Math.floor(lo / step) * step;
  if (lo >= 0 && start < 0) start = 0;
  const out = [];
  for (let v = start; v < hi + step * 0.999; v += step) out.push(+v.toFixed(10));
  return out;
}

function chart(E, m, bands, h = 190, compact = false) {
  const W = compact ? 120 : 560, H = compact ? 36 : h;
  const L = compact ? 2 : 44, R = compact ? 2 : 10, T = compact ? 3 : 10, B = compact ? 3 : 24;
  const t0 = ms(E.proj.start), t1 = Math.max(ms(m.targetDate), ...m.series.map((e) => ms(e.date)));
  const vals = [m.baseline, m.target, ...m.series.map((e) => e.level)];
  const ticks = niceTicks(Math.min(...vals), Math.max(...vals));
  const y0 = ticks[0], y1 = ticks[ticks.length - 1];
  const x = (t) => L + ((t - t0) / (t1 - t0 || 1)) * (W - L - R);
  const y = (v) => T + (1 - (v - y0) / (y1 - y0 || 1)) * (H - T - B);
  const pts = m.series.map((e) => [x(ms(e.date)), y(e.level), e]);
  const expLine = `M${x(t0)},${y(m.baseline)} L${x(ms(m.targetDate))},${y(m.target)}`;
  const line = pts.map((p, i) => `${i ? "L" : "M"}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(" ");
  if (compact) return `<svg class="chart" viewBox="0 0 ${W} ${H}" aria-hidden="true"><path d="${expLine}" stroke="var(--muted)" stroke-dasharray="3 3" fill="none"/><path d="${line}" stroke="var(--accent)" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Trend for ${esc(m.name)}">`;
  ticks.forEach((v) => (s += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end" class="num">${num(v, { compact: true })}</text>`));
  (bands || []).forEach((c) => {
    const a = Math.max(t0, ms(c.start)), b = Math.min(t1, c.end ? ms(c.end) : t1);
    if (b > a) s += `<rect x="${x(a)}" y="${T}" width="${x(b) - x(a)}" height="${H - T - B}" fill="var(--band)"/><text x="${x(a) + 4}" y="${T + 12}" style="fill:var(--ink-2)">${c.n}</text>`;
  });
  s += `<line x1="${L}" x2="${W - R}" y1="${y(m.target)}" y2="${y(m.target)}" stroke="var(--line-strong)"/><text x="${W - R - 2}" y="${y(m.target) - 4}" text-anchor="end">Target</text>`;
  s += `<line x1="${L}" x2="${W - R}" y1="${H - B}" y2="${H - B}" stroke="var(--line-strong)"/>`;
  const span = (t1 - t0) / 86400000;
  const stepM = span > 500 ? 6 : span > 200 ? 3 : 1;
  for (let d = new Date(Date.UTC(new Date(t0).getUTCFullYear(), new Date(t0).getUTCMonth(), 1)); d.getTime() <= t1; d = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + stepM, 1))) {
    if (d.getTime() >= t0) s += `<text x="${x(d.getTime())}" y="${H - 6}" text-anchor="middle">${month(d.getTime())}</text>`;
  }
  s += `<path d="${expLine}" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="4 4" fill="none"/>`;
  s += `<path d="${line}" stroke="var(--accent)" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`;
  pts.forEach(([px, py, e]) => {
    const expected = m.baseline + (m.target - m.baseline) * expectedOf(E.proj.start, m.targetDate, e.date);
    const tip = esc(`${date(e.date)}|${val(e.level, m.unit)} · ${e.confidence}|Expected ${val(expected, m.unit, { round: true })}${e.note ? "|" + e.note : ""}`);
    s += `<circle cx="${px}" cy="${py}" r="4" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/><circle class="dot" cx="${px}" cy="${py}" r="12" fill="transparent" data-tip="${tip}"/>`;
  });
  return s + "</svg>";
}

// ---------- dashboard pieces ----------
function metricCard(E, m, size, ev, bands) {
  const e = expAt(m);
  const evidence = ev.filter((x) => x.param === m.id);
  const mix = Object.entries(m.mix);
  return `<article class="card pad stack-sm">
    <div class="row between" style="align-items:flex-start;flex-wrap:nowrap"><div><h3 style="${size === "lg" ? "font-size:16px" : ""}">${esc(m.name)}</h3>${size === "lg" && m.definition ? `<p class="sub xs" style="margin-top:2px">${esc(m.definition)}</p>` : ""}</div>${status(m.status)}</div>
    ${m.riskFrom.length ? `<div class="risk"><strong>At risk:</strong> leading indicator ${esc(m.riskFrom.join(", "))} ${m.riskFrom.length === 1 ? "is" : "are"} behind target.</div>` : ""}
    <div class="row" style="align-items:baseline;gap:4px 8px"><span class="${size === "lg" ? "bigger" : "big"}">${val(m.current, m.unit, { compact: true })}</span><span class="sub">of ${val(m.target, m.unit, { compact: true })} target by ${date(m.targetDate)}</span></div>
    <div>${progress(m.progress, m.expected)}<div class="row between xs sub" style="margin-top:4px"><span>${pct(m.progress === null ? null : Math.max(0, m.progress))} of the way from baseline</span>${e !== null ? `<span>Expected at last update: ${val(e, m.unit, { compact: true, round: true })}</span>` : ""}</div></div>
    ${m.series.length ? chart(E, m, bands, size === "lg" ? 190 : 150) : ""}
    <div class="row" style="border-top:1px solid var(--line);padding-top:10px;margin-top:auto">${conf(m.latestConf)}<span class="xs muted">${m.latestDate ? "Updated " + date(m.latestDate) : "No entries yet"}${m.dataSource ? " · " + esc(m.dataSource) : ""}</span>${mix.length > 1 ? `<span class="xs muted">History: ${mix.map(([c, n]) => `${n} ${c}`).join(", ")}</span>` : ""}${evidence.length ? `<button class="btn small" style="margin-left:auto;color:var(--accent-ink)" data-evidence="${m.id}">${evidence.length} ${evidence.length === 1 ? "piece" : "pieces"} of evidence</button>` : ""}</div>
  </article>`;
}
function metricRow(E, m, ev) {
  const evidence = ev ? ev.filter((x) => x.param === m.id) : [];
  return `<tr><td><div style="font-weight:520">${esc(m.name)}</div><div class="xs muted">${m.latestDate ? "Updated " + date(m.latestDate) : "No entries yet"}</div>${m.riskFrom.length ? `<div class="xs" style="color:var(--warning-ink)">At risk: ${esc(m.riskFrom.join(", "))} behind</div>` : ""}</td>
  <td class="num" style="white-space:nowrap"><strong>${val(m.current, m.unit, { compact: true })}</strong> <span class="sub">/ ${val(m.target, m.unit, { compact: true })}</span></td>
  <td style="width:180px;vertical-align:middle">${progress(m.progress, m.expected)}</td><td style="width:130px;vertical-align:middle">${m.series.length ? chart(E, m, null, 36, true) : ""}</td>
  <td>${status(m.status)}</td><td>${conf(m.latestConf)}</td><td class="r">${evidence.length ? `<button class="btn small" style="color:var(--accent-ink)" data-evidence="${m.id}">${evidence.length} evidence</button>` : ""}</td></tr>`;
}
function summary(E) {

    <div class="card pad"><div class="label">Overall status</div><div style="margin-top:4px">${status(E.overall, true)}</div><p class="xs sub" style="margin-top:8px">Worst status among ${E.metrics.some((m) => m.isKey) ? "key metrics" : "all metrics"}.</p></div>
    <div class="card pad"><div class="label">Timeline</div><div class="big">${pct(E.elapsed)}</div><div class="track" style="margin-top:8px"><b style="width:${E.elapsed * 100}%"></b></div><p class="xs sub" style="margin-top:8px">${date(p.start)} – ${date(p.end)}${p.budget ? ` · Budget ${val(p.budget, sym(p.currency), { compact: true })}` : ""}</p></div>
    <div class="card pad"><div class="label">Metrics</div><ul style="list-style:none;padding:0;margin:8px 0 0;display:grid;gap:6px">${["green", "amber", "red", "no-data", "not-started"].filter((s) => E.counts[s]).map((s) => `<li class="row between">${status(s)}<strong class="num">${E.counts[s]}</strong></li>`).join("")}</ul></div>

function riskAlert(E) {

function tocStrip(proj) {
  const t = proj.toc;
  const items = [["input", t.inputs], ["activity", t.activities], ["output", t.outputs], ["outcome", t.outcomes], ["impact", t.impact]];
  if (!items.some(([, s]) => s)) return "";
  return `<details class="card pad" open><summary style="cursor:pointer;font-weight:600">Theory of change</summary><ol class="toc">${items.map(([l, s], i) => `<li><div class="eyebrow">${i + 1}. ${LEVEL_LABELS[l]}</div><p style="margin-top:4px">${s ? esc(s) : '<span class="muted">Not set</span>'}</p></li>`).join("")}</ol></details>`;
}
const correlation = `<p class="xs sub">Shaded periods show when campaigns ran. Changes during a campaign show <strong style="color:var(--ink)">correlation, not proof of cause</strong>: other things were happening at the same time.</p>`;
function campaignLegend(E) {
  if (!E.campaigns.length) return "";
  return `<div class="card pad stack-sm" style="padding:12px 14px"><div class="row" style="gap:6px 20px">${E.campaigns.map((c) => `<span class="row xs" style="gap:6px"><span class="legend-n">${c.n}</span><strong style="font-weight:560">${esc(c.name)}</strong><span class="muted">${CHANNELS[c.channel]} · ${date(c.start)} – ${c.end ? date(c.end) : "ongoing"}</span></span>`).join("")}</div>${correlation}</div>`;
}
const explainer = `<p class="xs muted">Status compares progress with where the metric should be by its latest entry, assuming steady progress from baseline at the project start to target at the target date: on track ≥ 90% of expected, behind ≥ 70%, off track below that. The tick on each bar marks where it should have been at its latest update.</p>`;

function levelSections(E, ev, bands) {
  const sections = [
    [["impact"], "lg", "The long-term change the programme contributes to."],
    [["outcome"], "lg", "Changes for participants and communities."],
    [["output"], "md", "What the programme has directly delivered."],
    [["activity", "input"], "row", "Delivery and resources."],
  ];
  return sections.map(([lv, size, blurb]) => {
    const items = E.metrics.filter((m) => lv.includes(m.level));
    if (!items.length) return "";
    const present = lv.filter((l) => items.some((m) => m.level === l));
    const head = `<div class="section-h"><h2 style="${size === "row" ? "font-size:16px" : ""}">${present.map((l) => LEVEL_LABELS[l]).join(" & ")}</h2><p class="sub">${blurb}</p></div>`;
    if (size === "row") return `<section>${head}<div class="card scroll"><table><tbody>${items.map((m) => metricRow(E, m, ev)).join("")}</tbody></table></div></section>`;
    return `<section>${head}<div class="grid ${size === "lg" ? "g2" : "g3c"}">${items.map((m) => metricCard(E, m, size, ev, bands)).join("")}</div></section>`;

}
function campaignTable(cs, currency) {

  ${cs.map((c) => `<tr><td><div style="font-weight:520"><span class="xs muted" style="margin-right:6px">${c.n}</span>${esc(c.name)}</div><div class="xs muted">${CHANNELS[c.channel]}${c.tag ? " · " + esc(c.tag) : ""}</div></td><td class="r">${val(c.spend, currency, { compact: true })}</td>${names.map((n) => `<td class="r">${c.totals[n] !== undefined ? num(c.totals[n], { compact: true }) : '<span class="muted">–</span>'}</td>`).join("")}<td class="r">${c.ctr === null ? '<span class="muted">–</span>' : pct(c.ctr, 1)}</td><td class="r">${c.cps === null ? '<span class="muted">–</span>' : val(c.cps, currency, { round: true })}</td></tr>`).join("")}</tbody></table></div>`;
}
function gantt(proj, cs, asOf) {
  const s = ms(proj.start), e = ms(proj.end);

  for (let d = new Date(s); d.getTime() <= e; d = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + 2, 1))) months.push(d.getTime());
  return `<div class="card pad"><div style="position:relative;height:18px;margin-left:min(200px,35%)" class="xs muted">${months.map((t) => `<span style="position:absolute;left:${p(t)}%;transform:translateX(-50%)">${month(t)}</span>`).join("")}</div>
  <div class="stack-sm" style="gap:8px">${cs.map((c) => `<div class="row" style="flex-wrap:nowrap;gap:0"><span style="width:min(200px,35%);flex-shrink:0;padding-right:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(c.name)}"><span class="xs muted" style="margin-right:6px">${c.n}</span>${esc(c.name)}</span><span class="gantt"><b style="left:${p(ms(c.start))}%;width:max(${p(ms(c.end || asOf)) - p(ms(c.start))}%,4px)" title="${date(c.start)} – ${c.end ? date(c.end) : "ongoing"}"></b></span></div>`).join("")}</div></div>`;
}
function evidenceItem(e, compact) {

function dashboardView(E, view, safe) {
  if (!E.metrics.length) return empty("Nothing to show yet", `<button class="linkbtn" style="color:var(--accent-ink);text-decoration:underline" data-go="param-new">Add parameters</button> and log some data to see the dashboard.`);

  const ev = E.proj.evidence.filter((e) => ms(e.date) <= ms(E.asOf) && visible(e, safe) && (!e.param || ids.has(e.param)));
  const bands = E.campaigns;

  }
  if (view === "comms") {
    const rank = ["impact", "outcome", "output", "activity", "input"];
    const head = E.metrics.filter((m) => m.current !== null && (m.isKey || ["impact", "outcome", "output"].includes(m.level))).sort((a, b) => b.isKey - a.isKey || rank.indexOf(a.level) - rank.indexOf(b.level)).slice(0, 6);
    const stories = ev.filter((e) => e.type !== "link");
    const links = ev.filter((e) => e.type === "link");
    return `${E.proj.toc.impact ? `<section class="card pad"><div class="label">What we are working towards</div><p style="font-size:18px;line-height:1.4;margin-top:4px;text-wrap:balance">${esc(E.proj.toc.impact)}</p></section>` : ""}

function field(label, name, control, hint = "") {

const inp = (name, value = "", attrs = "") => `<input class="input" id="f-${name}" name="${name}" value="${esc(value)}" ${attrs}>`;
const ta = (name, value = "", rows = 3, attrs = "") => `<textarea class="input" id="f-${name}" name="${name}" rows="${rows}" ${attrs}>${esc(value)}</textarea>`;
const sel = (name, options, value, attrs = "") => `<select class="input" id="f-${name}" name="${name}" ${attrs}>${options.map(([v, l]) => `<option value="${esc(v)}"${String(v) === String(value ?? "") ? " selected" : ""}>${esc(l)}</option>`).join("")}</select>`;
const actions = (submit, cancelGo) => `<div class="row" style="border-top:1px solid var(--line);padding-top:16px"><button class="btn primary" type="submit">${submit}</button>${cancelGo ? `<button type="button" class="btn ghost" data-go="${cancelGo}">Cancel</button>` : ""}<span class="err" data-err="_form" hidden></span></div>`;
function showErrors(form, errs) {
  form.querySelectorAll("[data-err]").forEach((el) => { el.hidden = true; el.textContent = ""; });
  form.querySelectorAll(".input.invalid").forEach((el) => el.classList.remove("invalid"));
  const keys = Object.keys(errs);
  keys.forEach((k) => {
    const el = form.querySelector(`[data-err="${k}"]`);
    if (el) { el.textContent = errs[k]; el.hidden = false; }
    form.querySelector(`[name="${k}"]`)?.classList.add("invalid");
  });
  if (keys.length) {
    const f = form.querySelector(`[data-err="_form"]`);
    if (f && !errs._form) { f.textContent = "Please fix the highlighted fields."; f.hidden = false; }
    form.querySelector(".input.invalid")?.focus();
  }
  return keys.length > 0;
}

const statusMix = (counts) => {
  const order = ["green", "amber", "red", "no-data"];
  const total = order.reduce((n, s) => n + (counts[s] || 0), 0);
  if (!total) return '<span class="xs muted">No metrics</span>';
  const col = { green: "good", amber: "warning", red: "critical", "no-data": "line-strong" };
  return `<div style="min-width:160px"><div style="display:flex;gap:2px;height:8px;border-radius:99px;overflow:hidden">${order.filter((s) => counts[s]).map((s) => `<i style="flex-grow:${counts[s]};background:var(--${col[s]})"></i>`).join("")}</div><div class="xs sub" style="margin-top:4px">${order.filter((s) => counts[s]).map((s) => `${counts[s]} ${STATUS[s][0].toLowerCase()}`).join(" · ")}</div></div>`;
};
function rollup(metrics) {
  const counts = { green: 0, amber: 0, red: 0, "no-data": 0, "not-started": 0 };
  metrics.forEach((m) => counts[m.status]++);
  const pool = metrics.some((m) => m.isKey) ? metrics.filter((m) => m.isKey) : metrics;
  const st = pool.map((m) => m.status);
  const overall = st.includes("red") ? "red" : st.includes("amber") ? "amber" : st.includes("green") ? "green" : "no-data";
  return { counts, overall };
}
function audienceSplit(metrics) {
  const part = (a) => {
    const ms_ = metrics.filter((m) => matchesAudience(m.audience, a));
    return `<div><div style="font-weight:560">${a === "external" ? "External" : "Internal"} <span class="muted" style="font-weight:400">· ${ms_.length} metrics</span></div><div style="margin-top:4px">${statusMix(rollup(ms_).counts)}</div></div>`;
  };
  return `<div class="card pad"><div class="label">By audience</div><div class="stack-sm" style="margin-top:8px">${part("external")}${part("internal")}</div></div>`;
}
function needsAttention(rows) {
  const items = rows.flatMap(({ p, E }) => E.metrics.filter((m) => m.riskFrom.length || (m.status === "red" && m.isKey)).map((m) => ({ p, m, why: m.riskFrom.length ? "At risk: a leading indicator is behind" : "Key metric off track" })));
  return `<section class="card pad"><h2 style="font-size:14px">Needs attention</h2>${items.length ? `<div>${items.map(({ p, m, why }, i) => `<div class="row between" style="padding:8px 0;${i ? "border-top:1px solid var(--line)" : ""}"><span><button type="button" class="linkbtn" style="padding:0;font-weight:560;color:var(--ink);text-decoration:underline;text-align:left" data-open="${p.id}">${esc(m.name)}</button> <span class="sub">· ${esc(p.name)}</span><span class="xs muted" style="display:block">${why}</span></span>${status(m.status)}</div>`).join("")}</div>` : '<p class="sub" style="margin-top:6px">Nothing flagged. Key metrics are on track or behind by less than the red threshold.</p>'}</section>`;
}

    return (key.length ? key : [...E.metrics].sort((a, b) => rank.indexOf(a.level) - rank.indexOf(b.level))).slice(0, 3);
  };
  return `<div class="card scroll"><table><thead><tr><th>Initiative</th><th>Overall</th><th>Timeline</th><th>Metrics</th><th>Key metrics</th></tr></thead><tbody>${rows.map(({ p, E }) => `<tr>

function previewEntriesCsv(text) {
  const p = P();
  const params = p.params.filter((x) => !x.archived);
  const find = (s) => params.find((x) => x.name.trim().toLowerCase() === String(s).trim().toLowerCase());
  const rows = parseCsv(text.trim());
  const [h, ...body] = rows;
  if (!h || h.length < 2) return { error: "The file needs a header row and at least two columns." };
  const cols = h.map((x) => x.trim().toLowerCase());
  const iP = cols.findIndex((c) => ["parameter", "metric", "name"].includes(c)), iD = cols.indexOf("date"), iV = cols.indexOf("value"), iC = cols.indexOf("confidence"), iN = cols.indexOf("note");
  const make = (line, name, d, v, c = "", note = "") => {
    const par = find(name), dt = parseDate(d), value = parseNum(v), confidence = (c || "").trim().toLowerCase() || "measured";
    let error = null;
    if (!String(name).trim()) error = "Missing parameter";
    else if (!par) error = `Unknown parameter “${String(name).trim()}”`;
    else if (!dt) error = `Invalid date “${d}” (use YYYY-MM-DD)`;
    else if (value === null || Number.isNaN(value)) error = `Invalid value “${v}”`;
    else if (!CONF.includes(confidence)) error = `Unknown confidence “${c}”`;
    return { line, name: String(name).trim(), pid: par?.id, date: dt, value: Number.isNaN(value) ? null : value, confidence, note: (note || "").trim(), error, update: !!(par && dt && par.entries.some((e) => e.date === dt)) };
  };
  let out, format;
  if (iP >= 0 && iD >= 0 && iV >= 0) { format = "long"; out = body.map((r, i) => make(i + 2, r[iP] ?? "", r[iD] ?? "", r[iV] ?? "", iC >= 0 ? r[iC] : "", iN >= 0 ? r[iN] : "")); }
  else {
    const bad = h.slice(1).findIndex((x) => !parseDate(x));
    if (bad >= 0) return { error: `Couldn't read column “${h[bad + 1]}”. Use either columns parameter,date,value or parameter followed by date columns (YYYY-MM-DD).` };
    format = "wide"; out = [];
    body.forEach((r, i) => h.slice(1).forEach((d, j) => { if ((r[j + 1] ?? "").trim() !== "") out.push(make(i + 2, r[0] ?? "", d, r[j + 1])); }));
  }
  const last = new Map();
  out.forEach((r, i) => !r.error && last.set(r.pid + "|" + r.date, i));
  out.forEach((r, i) => { if (!r.error && last.get(r.pid + "|" + r.date) !== i) r.error = "Duplicate: a later row sets the same value"; });
  return { format, rows: out };
}

function previewCampaignCsv(text) {
  const p = P();
  const rows = parseCsv(text.trim());
  const [h, ...body] = rows;
  const cols = (h || []).map((x) => x.trim().toLowerCase());
  const iC = cols.findIndex((c) => ["campaign", "tracking tag", "tag"].includes(c)), iD = cols.indexOf("date"), iM = cols.indexOf("metric"), iV = cols.indexOf("value");
  if (iC < 0 || iD < 0 || iM < 0 || iV < 0) return { error: "The header must include campaign, date, metric and value columns." };
  const find = (s) => { const k = String(s).trim().toLowerCase(); return p.campaigns.find((c) => c.name.toLowerCase() === k || (c.tag && c.tag.toLowerCase() === k)); };
  return {
    rows: body.map((r, i) => {
      const c = find(r[iC] ?? ""), d = parseDate(r[iD]), metric = normMetric(r[iM] ?? ""), value = parseNum(r[iV]);
      let error = null;
      if (!c) error = `Unknown campaign “${(r[iC] ?? "").trim()}”`;
      else if (!d) error = `Invalid date “${r[iD] ?? ""}”`;
      else if (!metric) error = "Missing metric name";
      else if (value === null || Number.isNaN(value)) error = `Invalid value “${r[iV] ?? ""}”`;
      return { line: i + 2, name: (r[iC] ?? "").trim(), cid: c?.id, date: d, metric, value: Number.isNaN(value) ? null : value, error };
    }),
  };
}

let toastTimer;
function toast(msg) {
  let t = document.querySelector(".toast");
  if (!t) { t = document.createElement("div"); t.className = "toast"; t.setAttribute("role", "status"); document.body.appendChild(t); }
  t.textContent = msg;

}
function openEvidence(id) {

  const safe = !!snap || ui.view !== "lead";
  const asOf = snap ? snap.asOf : TODAY;
  const m = src.params.find((x) => x.id === id);
  const items = src.evidence.filter((e) => e.param === id && visible(e, safe) && ms(e.date) <= ms(asOf));
  const el = document.createElement("div");
  el.className = "drawer";
  el.innerHTML = `<aside role="dialog" aria-modal="true" aria-label="Evidence for ${esc(m.name)}"><div class="row between" style="align-items:flex-start;margin-bottom:20px;flex-wrap:nowrap"><div><div class="label">Evidence</div><h2>${esc(m.name)}</h2></div><button type="button" class="btn" data-close>Close</button></div>${items.map((e) => `<div class="ev">${evidenceItem(e)}</div>`).join("")}</aside>`;

  el.addEventListener("click", (ev) => { if (ev.target === el || ev.target.closest("[data-close]")) el.remove(); });
}
function exportCsv() {
  const p = P();
  const rows = [["parameter", "date", "value", "confidence", "note", "logged_by"]];
  p.params.filter((x) => !x.archived).forEach((x) => [...x.entries].sort((a, b) => ms(a.date) - ms(b.date)).forEach((e) => rows.push([x.name, e.date, e.value, e.confidence, e.note || "", e.by || ""])));
  const csv = rows.map((r) => r.map((c) => (/[",\n]/.test(String(c)) ? `"${String(c).replace(/"/g, '""')}"` : c)).join(",")).join("\n");
  ui.csv = { text: csv };
  go("import");
  toast("Here's the export as CSV text. In the full app it downloads as a file; you can edit it here and re-import.");
}
const CONFIRMS = {
  "archive-param": (id) => { P().params.find((x) => x.id === id).archived = true; commit("Parameter archived. Its entries are kept."); },
  "delete-lib": (id) => { S.library = S.library.filter((l) => l.id !== id); S.projects.forEach((p) => p.params.forEach((x) => { if (x.libraryId === id) x.libraryId = null; })); commit("Definition deleted. Projects keep their own copy."); },
  "delete-campaign": (id) => { const p = P(); p.campaigns = p.campaigns.filter((c) => c.id !== id); commit("Campaign deleted.", "campaigns"); },
  "delete-evidence": (id) => { const p = P(); p.evidence = p.evidence.filter((e) => e.id !== id); commit("Evidence deleted."); },
  "delete-snapshot": (id) => { const p = P(); p.snapshots = p.snapshots.filter((s) => s.id !== id); commit("Snapshot deleted.", "snapshots"); },
};

document.addEventListener("click", (e) => {
  const t = e.target.closest("button,a,[data-go]");
  if (!t) return;
  const ds = t.dataset;
  if (ds.go) { e.preventDefault(); go(ds.go); }
  else if (ds.open) { ui.pid = ds.open; ui.view = "lead"; go("dashboard"); }
  else if (ds.openFa) { ui.faid = ds.openFa; go("focus-area"); }
  else if (ds.newInitiative !== undefined) { ui.faid = ds.newInitiative || null; go("project-new"); }
  else if (ds.editPerson !== undefined) go("person-edit", ds.editPerson);
  else if (ds.togglePerson !== undefined) { const u = S.users[+ds.togglePerson]; u.active = !u.active; commit(u.active ? `${u.name} reactivated.` : `${u.name} deactivated. They can no longer sign in.`); }
  else if (ds.archiveFa !== undefined) { const f = S.focusAreas.find((x) => x.id === ui.faid); f.archived = !f.archived; commit(f.archived ? "Focus area archived." : "Focus area restored.", "focus-area"); }
  else if (ds.view) { ui.view = ds.view; render(true); }
  else if (ds.snapview) { ui.snapView = ds.snapview; render(true); }
  else if (ds.aud) { ui.audience = ds.aud; render(true); }
  else if (ds.evidence) openEvidence(ds.evidence);
  else if (ds.share !== undefined) toast("In the full app, Share creates a read-only link for this view (live or a snapshot) that works without signing in.");
  else if (ds.toggleArchived !== undefined) { ui.showArchived = !ui.showArchived; render(true); }
  else if (ds.archiveProject !== undefined) { const p = P(); p.archived = !p.archived; commit(p.archived ? "Project archived. It's hidden from the portfolio." : "Project restored."); }
  else if (ds.editParam) go("param-edit", ds.editParam);
  else if (ds.restoreParam) { P().params.find((x) => x.id === ds.restoreParam).archived = false; commit("Parameter restored."); }
  else if (ds.toLibrary) {
    const x = P().params.find((y) => y.id === ds.toLibrary);
    const item = { id: uid("lib"), name: x.name, definition: x.definition, level: x.level, unit: x.unit, direction: x.direction, measureType: x.measureType, frequency: x.frequency, dataSource: x.dataSource };
    S.library.push(item); x.libraryId = item.id; commit(`“${x.name}” saved to the library.`);
  }
  else if (ds.useLib) go("param-new", ds.useLib);
  else if (ds.editLib) go("library-edit", ds.editLib);
  else if (ds.openCampaign) go("campaign", ds.openCampaign);
  else if (ds.editEvidence) go("evidence-form", ds.editEvidence);
  else if (ds.newEvidence !== undefined) go("evidence-form", null);
  else if (ds.approve) { const ev = P().evidence.find((x) => x.id === ds.approve); ev.approved = !ev.approved; ev.approvedBy = ev.approved ? me().name : null; commit(ev.approved ? "Approved: now visible on stakeholder views." : "Approval withdrawn: hidden from stakeholder views."); }
  else if (ds.openSnapshot) go("snapshot", ds.openSnapshot);
  else if (ds.export !== undefined) exportCsv();
  else if (ds.csvExample) {
    const ex = ds.csvExample === "csv"
      ? "parameter,date,value,confidence,note\nJournalists trained,2026-10-01,25,measured,\nReader trust score,2026-10-01,6.6,self-reported,Autumn survey\nNewsrooms using analytics weekly,2026-10-01,15,,"
      : "campaign,date,metric,value\nutm_campaign=toolkit_launch,2026-06-01,clicks,210\nNewsroom Futures roadshow,2026-09-01,attendees,120";
    ui[ds.csvExample] = { text: ex }; render(true);
  }
  else if (ds.csvPreview !== undefined) { const text = document.getElementById("f-csvtext").value; ui.csv = text.trim() ? { text, ...previewEntriesCsv(text) } : { text, error: "Paste some CSV or choose a file first." }; render(true); }
  else if (ds.csvCommit !== undefined) {
    const p = P(); const rows = ui.csv.rows; let created = 0, updated = 0;
    rows.filter((r) => !r.error).forEach((r) => { const x = p.params.find((y) => y.id === r.pid); r.update ? updated++ : created++; setEntry(x, r.date, r.value, r.confidence, r.note); });
    ui.csv = { text: "", done: { created, updated, skipped: rows.filter((r) => r.error).length } }; commit("Import complete.");
  }
  else if (ds.ccsvPreview !== undefined) { const text = document.getElementById("f-ccsvtext").value; ui.ccsv = text.trim() ? { text, ...previewCampaignCsv(text) } : { text, error: "Paste some CSV or choose a file first." }; render(true); }
  else if (ds.ccsvCommit !== undefined) {
    const p = P(); const ok = ui.ccsv.rows.filter((r) => !r.error);
    ok.forEach((r) => { const c = p.campaigns.find((x) => x.id === r.cid); const m = c.metrics.find((x) => x.date === r.date && x.metric === r.metric); if (m) m.value = r.value; else c.metrics.push({ date: r.date, metric: r.metric, value: r.value }); });
    ui.ccsv = { text: "", done: ok.length }; commit("Import complete.");
  }
  else if (ds.confirm) {
    // In-page confirmation: first click arms the button, second click acts.
    if (t.dataset.armed) { CONFIRMS[ds.confirm](ds.arg); return; }
    t.dataset.armed = "1"; t.textContent = "Click again to confirm"; t.classList.add("danger");
    setTimeout(() => { if (t.isConnected) { delete t.dataset.armed; t.textContent = ds.label; t.classList.remove("danger"); } }, 3500);
  }
  else if (ds.reset !== undefined) {
    if (!t.dataset.armed) { t.dataset.armed = "1"; t.textContent = "Click again to reset"; setTimeout(() => { if (t.isConnected) { delete t.dataset.armed; t.textContent = "Reset example data"; } }, 3500); return; }
    delete t.dataset.armed; t.textContent = "Reset example data";
    S = initialStore(); save(); ui.pid = null; go("portfolio"); toast("Example data restored.");
  }
});

document.addEventListener("submit", (e) => {
  const form = e.target.closest("form[data-form]");
  if (!form) return;
  e.preventDefault();
  const fd = new FormData(form);
  const kind = form.dataset.form;
  if (kind === "programme") {
    const e = {};
    const d = { name: fd.get("name").trim(), mission: fd.get("mission").trim(), description: fd.get("description").trim(), currency: fd.get("currency"), start: parseDate(fd.get("start")), end: parseDate(fd.get("end")) };
    const b = parseNum(fd.get("budget"));
    if (!d.name) e.name = "Required";
    if (b === null || Number.isNaN(b) || b < 0) e.budget = "Enter a number of 0 or more";
    if (!d.start) e.start = "Enter a valid date";
    if (!d.end) e.end = "Enter a valid date";
    if (d.start && d.end && ms(d.end) <= ms(d.start)) e.end = "End date must be after the start date";
    if (showErrors(form, e)) return;
    Object.assign(S.programme, d, { budget: b });
    commit("Programme saved.", "portfolio");
    return;
  }
  if (kind === "focusarea") {
    const e = {};
    const d = { name: fd.get("name").trim(), description: fd.get("description").trim(), owner: fd.get("owner") };
    const b = parseNum(fd.get("budget"));
    if (!d.name) e.name = "Required";
    if (Number.isNaN(b) || (b !== null && b < 0)) e.budget = "Enter a number of 0 or more";
    if (showErrors(form, e)) return;
    d.budget = b ?? 0;
    if (ui.page === "focus-area-edit") { Object.assign(S.focusAreas.find((x) => x.id === ui.faid), d); commit("Focus area saved.", "focus-area"); }
    else { const f = { id: uid("fa"), ...d, archived: false }; S.focusAreas.push(f); ui.faid = f.id; commit("Focus area created. Add its first initiative.", "focus-area"); }
    return;
  }
  if (kind === "person") {
    const e = {};
    const d = { name: fd.get("name").trim(), email: fd.get("email").trim().toLowerCase(), role: fd.get("role"), team: fd.get("role") === "partner" ? fd.get("team") : "" };
    const editing = ui.page === "person-edit" ? S.users[+ui.id] : null;
    if (!d.name) e.name = "Required";
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(d.email)) e.email = "Enter a valid email address";
    else if (S.users.some((u) => u.email === d.email && u !== editing)) e.email = "Someone already uses this email";
    if (editing && editing.email === me().email && d.role !== "admin") e.role = "You can't remove your own admin role";
    if (showErrors(form, e)) return;
    if (editing) { const wasMe = editing.email === S.user; Object.assign(editing, d); if (wasMe) S.user = d.email; commit("Saved.", "people"); }
    else { S.users.push({ ...d, active: true }); commit(`${d.name} added. In the full app they'd get a temporary password.`, "people"); }
    return;
  }
  if (kind === "project") {
    const { d, e: errs } = readProject(fd);
    if (showErrors(form, errs)) return;
    if (ui.page === "project-new") {
      const p = { id: uid("p"), ...d, archived: false, params: [], campaigns: [], evidence: [], snapshots: [], extraCols: [] };
      if (!p.focusAreaId && ui.faid) p.focusAreaId = ui.faid;
      S.projects.unshift(p); ui.pid = p.id; commit(`Initiative created. Next, add the parameters you'll track.`, "parameters");
    } else { Object.assign(P(), d); commit("Saved."); }
  } else if (kind === "param") {
    const { d, e: errs } = readParam(fd, "param");
    if (showErrors(form, errs)) return;
    const p = P();
    if (ui.page === "param-edit") Object.assign(p.params.find((x) => x.id === ui.id), d);
    else p.params.push({ id: uid("m"), ...d, libraryId: ui.formLib, archived: false, entries: [] });
    commit(ui.page === "param-edit" ? "Parameter saved." : "Parameter added. Log values on the Data entry tab.", "parameters");
  } else if (kind === "library") {
    const { d, e: errs } = readParam(fd, "library");
    if (showErrors(form, errs)) return;
    if (ui.page === "library-edit") Object.assign(S.library.find((l) => l.id === ui.id), d);
    else S.library.push({ id: uid("lib"), ...d });
    commit("Definition saved.", "library");
  } else if (kind === "entry") {
    const errs = {};
    const x = P().params.find((y) => y.id === fd.get("param"));
    const d = parseDate(fd.get("date")), v = parseNum(fd.get("value"));
    if (!d) errs.date = "Enter a valid date";
    if (v === null) errs.value = "Required"; else if (Number.isNaN(v)) errs.value = "Enter a number";
    if (showErrors(form, errs)) return;
    setEntry(x, d, v, fd.get("confidence"), fd.get("note").trim());
    ui.draft = { param: x.id, date: d, confidence: fd.get("confidence") };
    commit(`Saved ${val(v, x.unit)} for ${x.name} on ${date(d)}.`);
    document.querySelector("details.card")?.setAttribute("open", "");
  } else if (kind === "addcol") {
    const d = parseDate(fd.get("col"));
    if (!d) { toast("Choose a date for the new column."); return; }
    const p = P(); p.extraCols = [...new Set([...(p.extraCols || []), d])]; commit(`Added a column for ${date(d)}.`);
  } else if (kind === "campaign") {
    const { d, e: errs } = readCampaign(fd);
    if (showErrors(form, errs)) return;
    const p = P();
    if (ui.page === "campaign") { Object.assign(p.campaigns.find((c) => c.id === ui.id), d); commit("Campaign saved."); }
    else { const c = { id: uid("c"), ...d, metrics: [] }; p.campaigns.push(c); commit("Campaign created. Add its metrics below.", "campaign", c.id); }
  } else if (kind === "cmetric") {
    const errs = {};
    const d = parseDate(fd.get("date")), metric = normMetric(fd.get("metric") || ""), v = parseNum(fd.get("value"));
    if (!d) errs.date = "Enter a valid date";
    if (!metric) errs.metric = "Required";
    if (Number.isNaN(v)) errs.value = "Enter a number";
    if (showErrors(form, errs)) return;
    const c = P().campaigns.find((x) => x.id === ui.id);
    const i = c.metrics.findIndex((m) => m.date === d && m.metric === metric);
    if (v === null) { if (i >= 0) c.metrics.splice(i, 1); } else if (i >= 0) c.metrics[i].value = v; else c.metrics.push({ date: d, metric, value: v });
    ui.draft = { ...(ui.draft || {}), cdate: d, cmetric: metric };
    commit(v === null ? "Value removed." : "Value saved.");
  } else if (kind === "evidence") {
    const errs = {};
    const d = { type: fd.get("type"), date: parseDate(fd.get("date")), param: fd.get("param") || null, title: fd.get("title").trim(), body: fd.get("body").trim(), source: fd.get("source").trim(), url: fd.get("url").trim(), tags: fd.get("tags").split(",").map((s) => s.trim()).filter(Boolean).join(",") };
    if (!d.title) errs.title = "Required";
    if (!d.date) errs.date = "Enter a valid date";
    if (d.url && !/^https?:\/\//i.test(d.url)) errs.url = "Links must start with http:// or https://";
    if (showErrors(form, errs)) return;
    const p = P();
    if (ui.id) Object.assign(p.evidence.find((x) => x.id === ui.id), d);
    else p.evidence.push({ id: uid("e"), ...d, origin: "human", approved: false });
    commit(ui.id ? "Evidence saved." : "Evidence added.", "evidence");
  } else if (kind === "snapshot") {
    const errs = {};
    const label = fd.get("label").trim(), asOf = parseDate(fd.get("asOf"));
    if (!label) errs.label = "Required";
    if (!asOf) errs.asOf = "Enter a valid date";
    else if (ms(asOf) > ms(TODAY)) errs.asOf = "Snapshots can't be dated in the future";
    if (showErrors(form, errs)) return;
    const s = freeze(P(), label, asOf, me().name, TODAY);
    P().snapshots.push(s);
    commit("Snapshot frozen. Later edits won't change it.", "snapshot", s.id);
  }
});

document.addEventListener("change", async (e) => {
  const el = e.target;
  if (el.id === "f-user") {
    S.user = el.value; save();
    const u = me();
    if (GLOBAL_ADMIN.has(ui.page) && !can("manage-programme")) ui.page = "portfolio";
    render(true);
    toast(`Now signed in as ${u.name} (${who(u)}). ${ROLE_HELP[u.role === "partner" && u.team === "marketing" ? "marketing" : u.role]}`);
    return;
  }
  if (el.dataset.roleSelect !== undefined) {
    document.querySelector("[data-team-field]").hidden = el.value !== "partner";
    const h = document.querySelector('[data-hint="role"]'); if (h) h.textContent = ROLE_HELP[el.value];
    return;
  }
  if (el.dataset.evfilter !== undefined) { ui.evFilter = el.value; render(true); return; }
  if (el.dataset.gridconf !== undefined) { ui.gridConf = el.value; return; }
  if (el.dataset.csvfile) { const f = el.files?.[0]; if (f) { ui[el.dataset.csvfile] = { text: await f.text() }; render(true); } return; }
  if (!el.dataset.cell) return;
  const [pid, c] = el.dataset.cell.split("|");
  const x = P().params.find((y) => y.id === pid);
  const v = parseNum(el.value);
  if (Number.isNaN(v)) { el.classList.add("bad"); el.title = "Enter a number"; toast("Enter a number, e.g. 1200 or 6.5"); return; }
  el.classList.remove("bad");
  const had = x.entries.some((y) => y.date === c);
  setEntry(x, c, v, had ? undefined : ui.gridConf || "measured");
  save();
  const before = document.getElementById("st-" + pid).textContent;
  const m = evaluate(P(), TODAY).metrics.find((y) => y.id === pid);
  document.getElementById("st-" + pid).innerHTML = status(m.status);
  toast(v === null ? "Value cleared." : before !== STATUS[m.status][0] ? `Saved. ${x.name} is now “${STATUS[m.status][0]}”.` : "Saved. The dashboard uses the new value.");
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") document.querySelector(".drawer")?.remove();
  const el = e.target;
  if (!el.dataset?.cell) return;
  const [pid, c] = el.dataset.cell.split("|");
  const inputs = [...document.querySelectorAll("[data-cell]")];
  const rowIds = [...new Set(inputs.map((i) => i.dataset.cell.split("|")[0]))];
  const colIds = [...new Set(inputs.map((i) => i.dataset.cell.split("|")[1]))];
  const r = rowIds.indexOf(pid), k = colIds.indexOf(c);
  const move = (dr, dc) => { const t = document.getElementById(`cell-${rowIds[r + dr]}-${colIds[k + dc]}`); if (t) { e.preventDefault(); t.focus(); } else if (e.key === "Enter") { e.preventDefault(); el.blur(); } };
  if (e.key === "Enter" || e.key === "ArrowDown") move(1, 0);
  else if (e.key === "ArrowUp") move(-1, 0);
  else if (e.key === "ArrowLeft" && el.selectionStart === 0 && el.selectionEnd === 0) move(0, -1);
  else if (e.key === "ArrowRight" && el.selectionStart === el.value.length) move(0, 1);
});
document.addEventListener("focusin", (e) => { if (e.target.dataset?.cell) e.target.select(); });
let tip;
document.addEventListener("pointerover", (e) => {
  const d = e.target.closest?.("[data-tip]");
  if (!d) return;
  tip = tip || Object.assign(document.createElement("div"), { className: "tip" });
  const [a, b, c, n] = d.dataset.tip.split("|");
  tip.innerHTML = `<div class="muted">${esc(a)}</div><div class="num" style="font-weight:600">${esc(b)}</div><div class="num sub">${esc(c)}</div>${n ? `<div class="sub" style="max-width:240px">${esc(n)}</div>` : ""}`;
  document.body.appendChild(tip);
  const r = d.getBoundingClientRect();
  tip.style.left = Math.max(8, Math.min(window.innerWidth - 260, r.left + r.width / 2 + 10)) + "px";
  tip.style.top = Math.max(8, r.top - 10 - tip.offsetHeight) + "px";
});
document.addEventListener("pointerout", (e) => { if (e.target.closest?.("[data-tip]")) tip?.remove(); });

const startPage = (location.hash || "").slice(1);
ui.page = startPage === "library" ? "library" : "portfolio";
render();
</script>
